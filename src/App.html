<script>
  /**
   * Elevare PDI — Lógica do Frontend (Fase 2)
   */

  document.addEventListener('DOMContentLoaded', function () {
    initElevareApp();
  });

  function initElevareApp() {
    UI.initTheme();
    setupDynamicGreeting();
    setupNavigationAndTabs();
    setupSidebarControls();
    setupThemeToggle();
    bindActionButtons();
    setupQuickCreateModal();

    // Executa verificação inicial de conexão com o Google Sheets
    checkDatabaseConnection();
  }

  /**
   * Configura saudação contextual baseada no horário local.
   */
  function setupDynamicGreeting() {
    var greetingEl = document.getElementById('hero-greeting-text');
    if (!greetingEl) return;

    var hour = new Date().getHours();
    var greeting = 'Olá';
    if (hour >= 5 && hour < 12) {
      greeting = 'Bom dia';
    } else if (hour >= 12 && hour < 18) {
      greeting = 'Boa tarde';
    } else {
      greeting = 'Boa noite';
    }

    greetingEl.textContent = greeting + '! Bem-vindo ao Elevare PDI';
  }

  /**
   * Navegação fluida entre abas da interface.
   */
  function setupNavigationAndTabs() {
    var tabs = document.querySelectorAll('.view-tab');
    tabs.forEach(function (tab) {
      tab.addEventListener('click', function () {
        var targetId = tab.dataset.target;
        switchTab(targetId);
      });
    });

    // Links da barra lateral também ativam a aba correspondente
    var navLinks = document.querySelectorAll('.nav-link');
    navLinks.forEach(function (link) {
      link.addEventListener('click', function (e) {
        e.preventDefault();
        navLinks.forEach(function (l) { l.classList.remove('active'); });
        link.classList.add('active');

        var targetTab = link.dataset.tab;
        if (targetTab) {
          switchTab(targetTab);
        }
      });
    });

    // Badge no header também direciona para a aba do banco
    var topbarBadge = document.getElementById('topbar-db-badge');
    if (topbarBadge) {
      topbarBadge.addEventListener('click', function () {
        switchTab('tab-database');
        var navDb = document.getElementById('nav-database');
        if (navDb) {
          navLinks.forEach(function (l) { l.classList.remove('active'); });
          navDb.classList.add('active');
        }
      });
    }
  }

  function switchTab(targetTabId) {
    var tabBtns = document.querySelectorAll('.view-tab');
    tabBtns.forEach(function (b) {
      b.classList.toggle('active', b.dataset.target === targetTabId);
    });

    var paneDashboard = document.getElementById('pane-dashboard');
    var paneDatabase = document.getElementById('pane-database');

    if (targetTabId === 'tab-dashboard') {
      if (paneDashboard) paneDashboard.style.display = 'block';
      if (paneDatabase) paneDatabase.style.display = 'none';
    } else {
      if (paneDashboard) paneDashboard.style.display = 'none';
      if (paneDatabase) paneDatabase.style.display = 'block';
    }
  }

  /**
   * Controles da Sidebar (Recolher no Desktop / Gaveta no Mobile).
   */
  function setupSidebarControls() {
    var sidebar = document.getElementById('app-sidebar');
    var toggleBtn = document.getElementById('sidebar-toggle-btn');
    var mobileBtn = document.getElementById('mobile-menu-btn');

    if (toggleBtn && sidebar) {
      toggleBtn.addEventListener('click', function () {
        sidebar.classList.toggle('collapsed');
      });
    }

    if (mobileBtn && sidebar) {
      mobileBtn.addEventListener('click', function () {
        sidebar.classList.toggle('mobile-open');
      });
    }
  }

  /**
   * Alternador de Tema Escuro / Claro.
   */
  function setupThemeToggle() {
    var btn = document.getElementById('theme-toggle-btn');
    if (btn) {
      btn.addEventListener('click', function () {
        UI.toggleTheme();
      });
    }
  }

  /**
   * Vincula os botões de ação e diagnósticos.
   */
  function bindActionButtons() {
    var btnCheck = document.getElementById('btn-check-db');
    if (btnCheck) {
      btnCheck.addEventListener('click', function () {
        checkDatabaseConnection(btnCheck);
      });
    }

    var btnRefreshDash = document.getElementById('btn-action-refresh-dash');
    if (btnRefreshDash) {
      btnRefreshDash.addEventListener('click', function () {
        checkDatabaseConnection(btnRefreshDash);
      });
    }

    var btnSetup = document.getElementById('btn-setup-db');
    if (btnSetup) {
      btnSetup.addEventListener('click', function () {
        runSetupDatabase(btnSetup);
      });
    }

    var btnTestPersistence = document.getElementById('btn-test-persistence');
    if (btnTestPersistence) {
      btnTestPersistence.addEventListener('click', function () {
        runPersistenceTest(btnTestPersistence);
      });
    }

    var btnQuickCreate = document.getElementById('btn-quick-create');
    if (btnQuickCreate) {
      btnQuickCreate.addEventListener('click', function () {
        UI.openModal('modal-quick-create');
      });
    }
  }

  /**
   * Modal de Criação Rápida de Registro.
   */
  function setupQuickCreateModal() {
    var btnSave = document.getElementById('btn-save-quick-record');
    if (!btnSave) return;

    btnSave.addEventListener('click', function () {
      var moduleSelect = document.getElementById('quick-target-module');
      var titleInput = document.getElementById('quick-title');
      var descInput = document.getElementById('quick-desc');

      var targetTable = moduleSelect ? moduleSelect.value : 'METAS';
      var title = titleInput ? titleInput.value.trim() : '';
      var desc = descInput ? descInput.value.trim() : '';

      if (!title) {
        UI.showToast('Campo Obrigatório', 'Por favor, informe o título do registro.', 'warning');
        if (titleInput) titleInput.focus();
        return;
      }

      UI.setLoading(btnSave, true, 'Salvando...');

      var recordData = {};
      if (targetTable === 'METAS') {
        recordData = {
          titulo: title,
          descricao: desc,
          data_inicial: new Date().toISOString().split('T')[0],
          prazo: new Date(Date.now() + 30 * 86400000).toISOString().split('T')[0],
          prioridade: 'media',
          status: 'em_andamento'
        };
      } else if (targetTable === 'ACOES') {
        recordData = {
          titulo: title,
          descricao: desc,
          prazo: new Date(Date.now() + 7 * 86400000).toISOString().split('T')[0],
          prioridade: 'alta',
          status: 'em_progresso',
          origem_tipo: 'avulsa'
        };
      } else if (targetTable === 'FEEDBACKS') {
        recordData = {
          titulo: title,
          descricao: desc,
          data: new Date().toISOString().split('T')[0],
          origem: 'Autoavaliação',
          status: 'novo',
          prioridade: 'media'
        };
      } else if (targetTable === 'COMPETENCIAS') {
        recordData = {
          nome: title,
          descricao: desc,
          tipo: 'hard_skill',
          nivel_atual: 3,
          nivel_desejado: 5,
          importancia: 'alta',
          status: 'em_desenvolvimento'
        };
      } else if (targetTable === 'LIVROS') {
        recordData = {
          titulo: title,
          resumo: desc,
          status: 'quero_ler',
          total_paginas: 300,
          pagina_atual: 0,
          percentual_leitura: 0,
          estante: 'quero_ler',
          favorito: false
        };
      }

      ApiClient.call('apiCreateRecord', targetTable, recordData)
        .then(function (created) {
          UI.setLoading(btnSave, false);
          UI.closeModal('modal-quick-create');
          UI.showToast('Registro Gravado!', 'Item salvo com sucesso na aba ' + targetTable + ' da sua planilha.', 'success');

          // Limpa o formulário
          if (titleInput) titleInput.value = '';
          if (descInput) descInput.value = '';

          // Atualiza as métricas da interface
          checkDatabaseConnection();
        })
        .catch(function (err) {
          UI.setLoading(btnSave, false);
          UI.showToast('Erro ao Salvar', err.message, 'error');
        });
    });
  }

  /**
   * Verifica a conexão real com o Google Sheets e atualiza os KPIs do Dashboard.
   */
  function checkDatabaseConnection(btnElement) {
    var statusBadge = document.getElementById('db-status-badge');
    var statusDot = document.getElementById('db-status-dot');
    var statusText = document.getElementById('db-status-text');
    var dbMetricsGrid = document.getElementById('db-metrics-grid');
    var unconfiguredBanner = document.getElementById('unconfigured-banner');

    if (btnElement) UI.setLoading(btnElement, true, 'Carregando...');

    ApiClient.call('apiGetDatabaseStatus')
      .then(function (status) {
        if (btnElement) UI.setLoading(btnElement, false);

        if (status.configured && status.status === 'CONECTADO') {
          if (statusDot) statusDot.className = 'status-dot active';
          if (statusBadge) statusBadge.className = 'badge badge-success';
          if (statusText) statusText.textContent = 'Conectado';

          if (unconfiguredBanner) unconfiguredBanner.style.display = 'none';
          if (dbMetricsGrid) dbMetricsGrid.style.display = 'grid';

          var totalSheetsEl = document.getElementById('metric-total-sheets');
          if (totalSheetsEl) totalSheetsEl.textContent = status.totalSheets || '15';

          var emailEl = document.getElementById('metric-user-email');
          if (emailEl) emailEl.textContent = status.currentUser || '—';

          var nameEl = document.getElementById('metric-sheet-name');
          if (nameEl) nameEl.textContent = status.spreadsheetName || 'Elevare PDI';

          var linkEl = document.getElementById('metric-sheet-link');
          if (linkEl && status.spreadsheetUrl) {
            linkEl.href = status.spreadsheetUrl;
            linkEl.style.display = 'inline-flex';
          }

          // Renderiza a tabela de diagnóstico das abas
          renderSheetsTable(status.sheets);

          // Atualiza contadores reais dos KPIs
          updateDashboardKPIs(status.sheets);
        } else {
          if (statusDot) statusDot.className = 'status-dot pending';
          if (statusBadge) statusBadge.className = 'badge badge-warning';
          if (statusText) statusText.textContent = 'Não Inicializado';

          if (unconfiguredBanner) unconfiguredBanner.style.display = 'block';
          if (dbMetricsGrid) dbMetricsGrid.style.display = 'none';
        }
      })
      .catch(function (err) {
        if (btnElement) UI.setLoading(btnElement, false);
        if (statusDot) statusDot.className = 'status-dot error';
        if (statusBadge) statusBadge.className = 'badge badge-error';
        if (statusText) statusText.textContent = 'Erro';

        if (unconfiguredBanner) unconfiguredBanner.style.display = 'block';
      });
  }

  /**
   * Atualiza os KPIs do Dashboard com base nos registros reais das abas.
   */
  function updateDashboardKPIs(sheets) {
    if (!sheets || !Array.isArray(sheets)) return;

    var counts = {};
    for (var i = 0; i < sheets.length; i++) {
      counts[sheets[i].name] = sheets[i].rows;
    }

    var kpiMetasAndamento = document.getElementById('kpi-metas-andamento');
    if (kpiMetasAndamento) kpiMetasAndamento.textContent = counts['METAS'] || 0;

    var kpiFeedbacks = document.getElementById('kpi-feedbacks-total');
    if (kpiFeedbacks) kpiFeedbacks.textContent = counts['FEEDBACKS'] || 0;

    var kpiLivros = document.getElementById('kpi-livros-total');
    if (kpiLivros) kpiLivros.textContent = counts['LIVROS'] || 0;
  }

  /**
   * Executa a inicialização das 15 abas.
   */
  function runSetupDatabase(btnElement) {
    if (!confirm('Deseja inicializar o banco de dados agora? As 15 abas estruturadas serão criadas na sua planilha do Google Drive.')) {
      return;
    }

    UI.setLoading(btnElement, true, 'Configurando...');
    ApiClient.call('apiSetup')
      .then(function (result) {
        UI.setLoading(btnElement, false);
        UI.showToast('Instalação Concluída', 'Banco configurado com ' + result.totalSheets + ' abas no seu Google Drive.', 'success', 6000);
        checkDatabaseConnection();
      })
      .catch(function (err) {
        UI.setLoading(btnElement, false);
        UI.showToast('Falha na Configuração', err.message, 'error', 8000);
      });
  }

  /**
   * Executa a bateria de 7 testes de persistência real no Google Sheets.
   */
  function runPersistenceTest(btnElement) {
    var consoleBox = document.getElementById('test-console-output');
    var noteInput = document.getElementById('test-note-input');
    var testNote = noteInput ? noteInput.value : '';

    UI.setLoading(btnElement, true, 'Executando 7 Testes...');
    if (consoleBox) {
      consoleBox.textContent = '⏳ Executando bateria completa de 7 testes de persistência real no Google Sheets...\n- Comunicando via google.script.run...\n- Aguardando execução do LockService e SpreadsheetApp...\n';
    }

    ApiClient.call('apiRunFullPersistenceValidation', testNote)
      .then(function (res) {
        UI.setLoading(btnElement, false);
        UI.showToast('Persistência 100% Aprovada!', 'Todos os 7 testes foram validados no Google Sheets.', 'success', 6000);

        if (consoleBox) {
          var log = '=====================================================\n';
          log += '✅ BATERIA DE TESTES DE PERSISTÊNCIA: 100% APROVADA\n';
          log += '=====================================================\n';
          log += 'Horário: ' + res.timestamp + '\n';
          log += 'Planilha: ' + (res.spreadsheetUrl || 'Vinculada com sucesso') + '\n\n';

          if (res.tests && Array.isArray(res.tests)) {
            for (var i = 0; i < res.tests.length; i++) {
              var t = res.tests[i];
              log += '[' + t.step + '/7] ✅ ' + t.name.toUpperCase() + '\n';
              log += '      Detalhe: ' + t.detail + '\n\n';
            }
          }

          log += '=====================================================\n';
          log += 'RESULTADO: O Google Sheets está apto para suportar o PDI!\n';
          log += 'Nenhum dado real foi corrompido ou modificado.\n';
          log += '=====================================================';

          consoleBox.textContent = log;
        }

        checkDatabaseConnection();
      })
      .catch(function (err) {
        UI.setLoading(btnElement, false);
        UI.showToast('Falha no Teste', err.message, 'error', 8000);

        if (consoleBox) {
          consoleBox.textContent = 
            '=====================================================\n' +
            '❌ FALHA NA PERSISTÊNCIA REAL:\n' +
            '=====================================================\n' +
            err.message + '\n\n' +
            'Sugestão: Verifique se a função setupApplication() foi executada e se você concedeu as permissões ao Apps Script.';
        }
      });
  }

  /**
   * Renderiza a tabela de diagnóstico das abas.
   */
  function renderSheetsTable(sheets) {
    var tbody = document.getElementById('sheets-table-body');
    if (!tbody) return;

    if (!sheets || sheets.length === 0) {
      tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:var(--text-muted); padding:2rem;">Nenhuma aba encontrada.</td></tr>';
      return;
    }

    var html = '';
    for (var i = 0; i < sheets.length; i++) {
      var s = sheets[i];
      html += 
        '<tr style="border-bottom: 1px solid var(--border-subtle);">' +
          '<td style="padding: 0.75rem 1rem;"><strong>' + UI.escapeHtml(s.name) + '</strong></td>' +
          '<td style="padding: 0.75rem 1rem;"><span class="badge badge-info">' + s.rows + ' registros</span></td>' +
          '<td style="padding: 0.75rem 1rem; color:var(--text-secondary);">' + s.cols + ' colunas</td>' +
          '<td style="padding: 0.75rem 1rem;"><span class="badge badge-success">OK</span></td>' +
        '</tr>';
    }
    tbody.innerHTML = html;
  }
</script>
