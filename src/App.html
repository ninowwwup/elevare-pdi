<script>
  /**
   * Elevare PDI — Lógica Principal do Frontend (App.html)
   * Responsável pelo ciclo de vida da interface, verificação do banco de dados e testes de persistência.
   */

  document.addEventListener('DOMContentLoaded', function () {
    initApp();
  });

  function initApp() {
    setupSidebarToggle();
    checkDatabaseConnection();
    bindActionButtons();
  }

  /**
   * Alternância de recolhimento da barra lateral.
   */
  function setupSidebarToggle() {
    var sidebar = document.getElementById('app-sidebar');
    var toggleBtn = document.getElementById('sidebar-toggle');
    if (toggleBtn && sidebar) {
      toggleBtn.addEventListener('click', function () {
        sidebar.classList.toggle('collapsed');
      });
    }
  }

  /**
   * Vincula os botões de ação às funções da API.
   */
  function bindActionButtons() {
    var btnCheck = document.getElementById('btn-check-db');
    if (btnCheck) {
      btnCheck.addEventListener('click', function () {
        checkDatabaseConnection(btnCheck);
      });
    }

    var btnSetup = document.getElementById('btn-setup-db');
    if (btnSetup) {
      btnSetup.addEventListener('click', function () {
        runSetupDatabase(btnSetup);
      });
    }

    var btnTestPersistence = document.getElementById('btn-test-persistence');
    if (btnTestPersistence) {
      btnTestPersistence.addEventListener('click', function () {
        runPersistenceTest(btnTestPersistence);
      });
    }
  }

  /**
   * Verifica a conexão real com a planilha do Google Sheets.
   */
  function checkDatabaseConnection(btnElement) {
    var statusBadge = document.getElementById('db-status-badge');
    var statusDot = document.getElementById('db-status-dot');
    var statusText = document.getElementById('db-status-text');
    var sheetInfoContainer = document.getElementById('sheet-info-container');
    var unconfiguredBanner = document.getElementById('unconfigured-banner');

    if (btnElement) {
      UI.setLoading(btnElement, true, 'Verificando...');
    }

    ApiClient.call('apiGetDatabaseStatus')
      .then(function (status) {
        if (btnElement) UI.setLoading(btnElement, false);

        if (status.configured && status.status === 'CONECTADO') {
          // Conectado com sucesso
          statusDot.className = 'status-dot active';
          statusBadge.className = 'badge badge-success';
          statusText.textContent = 'Conectado';

          if (unconfiguredBanner) unconfiguredBanner.style.display = 'none';
          if (sheetInfoContainer) sheetInfoContainer.style.display = 'block';

          // Atualiza dados na tela
          document.getElementById('metric-total-sheets').textContent = status.totalSheets || '0';
          document.getElementById('metric-user-email').textContent = status.currentUser || '—';
          document.getElementById('metric-sheet-name').textContent = status.spreadsheetName || 'Planilha Elevare PDI';

          var linkEl = document.getElementById('metric-sheet-link');
          if (linkEl && status.spreadsheetUrl) {
            linkEl.href = status.spreadsheetUrl;
            linkEl.style.display = 'inline-flex';
          }

          // Renderiza tabela de abas
          renderSheetsTable(status.sheets);

          UI.showToast('Banco Conectado', 'Acesso à planilha verificado com sucesso.', 'success');
        } else {
          // Não configurado
          statusDot.className = 'status-dot pending';
          statusBadge.className = 'badge badge-warning';
          statusText.textContent = 'Não Inicializado';

          if (unconfiguredBanner) unconfiguredBanner.style.display = 'block';
          if (sheetInfoContainer) sheetInfoContainer.style.display = 'none';

          UI.showToast('Configuração Pendente', status.message || 'Execute a inicialização para criar o banco.', 'warning');
        }
      })
      .catch(function (err) {
        if (btnElement) UI.setLoading(btnElement, false);

        statusDot.className = 'status-dot error';
        statusBadge.className = 'badge badge-error';
        statusText.textContent = 'Erro de Conexão';

        if (unconfiguredBanner) unconfiguredBanner.style.display = 'block';
        if (sheetInfoContainer) sheetInfoContainer.style.display = 'none';

        UI.showToast('Erro de Conexão', err.message, 'error', 7000);
      });
  }

  /**
   * Executa a inicialização do banco de dados (criação das 15 abas).
   */
  function runSetupDatabase(btnElement) {
    if (!confirm('Deseja iniciar a configuração automática do banco de dados? As 15 abas necessárias serão criadas na sua planilha do Google Drive.')) {
      return;
    }

    UI.setLoading(btnElement, true, 'Configurando abas...');

    ApiClient.call('apiSetup')
      .then(function (result) {
        UI.setLoading(btnElement, false);
        UI.showToast('Instalação Concluída', 'Banco configurado com ' + result.totalSheets + ' abas no seu Google Drive.', 'success', 6000);
        checkDatabaseConnection();
      })
      .catch(function (err) {
        UI.setLoading(btnElement, false);
        UI.showToast('Falha na Configuração', err.message, 'error', 8000);
      });
  }

  /**
   * Executa a bateria de 7 testes de persistência real no Google Sheets.
   */
  function runPersistenceTest(btnElement) {
    var consoleBox = document.getElementById('test-console-output');
    var noteInput = document.getElementById('test-note-input');
    var testNote = noteInput ? noteInput.value : '';

    UI.setLoading(btnElement, true, 'Executando 7 Testes...');
    if (consoleBox) {
      consoleBox.textContent = '⏳ Iniciando bateria completa de 7 testes de persistência real no Google Sheets...\n- Comunicando via google.script.run...\n- Aguardando execução do LockService e SpreadsheetApp...\n';
    }

    ApiClient.call('apiRunFullPersistenceValidation', testNote)
      .then(function (res) {
        UI.setLoading(btnElement, false);
        UI.showToast('Persistência 100% Aprovada!', 'Todos os 7 testes de ciclo de vida foram validados no Google Sheets.', 'success', 6000);

        if (consoleBox) {
          var log = '=====================================================\n';
          log += '✅ BATERIA DE TESTES DE PERSISTÊNCIA: 100% APROVADA\n';
          log += '=====================================================\n';
          log += 'Horário: ' + res.timestamp + '\n';
          log += 'Planilha: ' + (res.spreadsheetUrl || 'Vinculada com sucesso') + '\n\n';

          if (res.tests && Array.isArray(res.tests)) {
            for (var i = 0; i < res.tests.length; i++) {
              var t = res.tests[i];
              log += '[' + t.step + '/7] ✅ ' + t.name.toUpperCase() + '\n';
              log += '      Detalhe: ' + t.detail + '\n\n';
            }
          }

          log += '=====================================================\n';
          log += 'RESULTADO: O Google Sheets está apto para suportar o PDI!\n';
          log += 'Nenhum dado real foi corrompido ou modificado.\n';
          log += '=====================================================';

          consoleBox.textContent = log;
        }

        // Atualiza a tabela de diagnóstico após os testes
        checkDatabaseConnection();
      })
      .catch(function (err) {
        UI.setLoading(btnElement, false);
        UI.showToast('Falha no Teste', err.message, 'error', 8000);

        if (consoleBox) {
          consoleBox.textContent = 
            '=====================================================\n' +
            '❌ FALHA NA PERSISTÊNCIA REAL:\n' +
            '=====================================================\n' +
            err.message + '\n\n' +
            'Sugestão: Verifique se a função setupApplication() foi executada e se você concedeu as permissões ao Apps Script.';
        }
      });
  }

  /**
   * Renderiza a tabela de diagnóstico das 15 abas.
   */
  function renderSheetsTable(sheets) {
    var tbody = document.getElementById('sheets-table-body');
    if (!tbody) return;

    if (!sheets || sheets.length === 0) {
      tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:var(--text-muted); padding:2rem;">Nenhuma aba encontrada.</td></tr>';
      return;
    }

    var html = '';
    for (var i = 0; i < sheets.length; i++) {
      var s = sheets[i];
      html += 
        '<tr>' +
          '<td><strong>' + UI.escapeHtml(s.name) + '</strong></td>' +
          '<td><span class="badge badge-info">' + s.rows + ' registros</span></td>' +
          '<td>' + s.cols + ' colunas</td>' +
          '<td><span class="badge badge-success">OK</span></td>' +
        '</tr>';
    }
    tbody.innerHTML = html;
  }
</script>
