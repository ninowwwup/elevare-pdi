<script>
  /**
   * Elevare PDI — Lógica do Frontend (Fase 3: Funcionalidades Completas)
   * Controla a navegação, persistência real, formulários, filtros, estante 3D e KPIs.
   */

  window.App = (function () {
    // Cache de dados locais em memória
    var state = {
      activePane: 'pane-dashboard',
      pdiList: [],
      swotList: [],
      skillsList: [],
      metasList: [],
      acoesList: [],
      feedbacksList: [],
      livrosList: [],
      activeBookshelfView: '3d',
      selectedEvalLevel: 3,
      deleteInfo: { table: '', id: '', name: '' }
    };

    /**
     * Inicialização da aplicação ao carregar a página.
     */
    function init() {
      UI.initTheme();
      setupDynamicGreeting();
      setupNavigation();
      setupSidebarControls();
      setupThemeToggle();
      setupGlobalSearch();
      bindGlobalButtons();

      // Carrega dados iniciais do Dashboard e verifica conexão
      loadDashboardData();
      checkDatabaseConnection();
    }

    /**
     * Configura saudação contextual baseada na hora local.
     */
    function setupDynamicGreeting() {
      var greetingEl = document.getElementById('hero-greeting-text');
      if (!greetingEl) return;

      var hour = new Date().getHours();
      var greeting = 'Olá';
      if (hour >= 5 && hour < 12) {
        greeting = 'Bom dia';
      } else if (hour >= 12 && hour < 18) {
        greeting = 'Boa tarde';
      } else {
        greeting = 'Boa noite';
      }
      greetingEl.textContent = greeting + '! Bem-vindo ao Elevare PDI';
    }

    /**
     * Navegação entre abas e painéis sincronizada entre Sidebar e Top Tabs.
     */
    function setupNavigation() {
      // 1. Links da barra lateral
      var navLinks = document.querySelectorAll('.sidebar-nav .nav-link');
      navLinks.forEach(function (link) {
        link.addEventListener('click', function (e) {
          e.preventDefault();
          var targetPane = link.dataset.pane;
          if (targetPane) {
            switchPane(targetPane);
          }
        });
      });

      // 2. Botões das abas superiores
      var viewTabs = document.querySelectorAll('.view-tab');
      viewTabs.forEach(function (tab) {
        tab.addEventListener('click', function () {
          var targetPane = tab.dataset.pane;
          if (targetPane) {
            switchPane(targetPane);
          }
        });
      });
    }

    /**
     * Alterna o painel visível e carrega os dados correspondentes sob demanda.
     */
    function switchPane(targetPaneId) {
      state.activePane = targetPaneId;

      // Atualiza abas superiores
      var viewTabs = document.querySelectorAll('.view-tab');
      viewTabs.forEach(function (tab) {
        tab.classList.toggle('active', tab.dataset.pane === targetPaneId);
      });

      // Atualiza links da sidebar
      var navLinks = document.querySelectorAll('.sidebar-nav .nav-link');
      navLinks.forEach(function (link) {
        link.classList.toggle('active', link.dataset.pane === targetPaneId);
      });

      // Oculta todos os painéis e exibe o alvo
      hideBookHoverCardImmediately();
      var panes = document.querySelectorAll('.tab-pane');
      panes.forEach(function (pane) {
        pane.style.display = (pane.id === targetPaneId) ? 'block' : 'none';
      });

      // Fecha sidebar móvel se aberta
      var sidebar = document.getElementById('app-sidebar');
      if (sidebar && sidebar.classList.contains('mobile-open')) {
        sidebar.classList.remove('mobile-open');
      }

      // Dispara o carregamento de dados do módulo selecionado
      if (targetPaneId === 'pane-dashboard') {
        loadDashboardData();
      } else if (targetPaneId === 'pane-pdi') {
        loadPdiList();
      } else if (targetPaneId === 'pane-swot') {
        loadSwotList();
      } else if (targetPaneId === 'pane-skills') {
        loadSkillsList();
      } else if (targetPaneId === 'pane-metas') {
        loadMetasList();
      } else if (targetPaneId === 'pane-feedbacks') {
        loadFeedbacksList();
      } else if (targetPaneId === 'pane-biblioteca') {
        loadLivrosList();
      } else if (targetPaneId === 'pane-database') {
        checkDatabaseConnection();
      }
    }

    /**
     * Configura atalho Ctrl+K e busca global.
     */
    function setupGlobalSearch() {
      var searchInput = document.getElementById('global-search-input');
      if (!searchInput) return;

      document.addEventListener('keydown', function (e) {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
          e.preventDefault();
          searchInput.focus();
        }
      });

      searchInput.addEventListener('input', function () {
        var query = searchInput.value.trim().toLowerCase();

        // Repassa a busca para o módulo ativo
        if (state.activePane === 'pane-pdi') {
          var pdiInput = document.getElementById('pdi-search-input');
          if (pdiInput) { pdiInput.value = query; filterPdiList(); }
        } else if (state.activePane === 'pane-swot') {
          var swotInput = document.getElementById('swot-search-input');
          if (swotInput) { swotInput.value = query; filterSwotList(); }
        } else if (state.activePane === 'pane-skills') {
          var skillInput = document.getElementById('skills-search-input');
          if (skillInput) { skillInput.value = query; filterSkillsList(); }
        } else if (state.activePane === 'pane-metas') {
          var metaInput = document.getElementById('metas-search-input');
          if (metaInput) { metaInput.value = query; filterMetasList(); }
        } else if (state.activePane === 'pane-feedbacks') {
          var fbInput = document.getElementById('feedbacks-search-input');
          if (fbInput) { fbInput.value = query; filterFeedbacksList(); }
        } else if (state.activePane === 'pane-biblioteca') {
          var bookInput = document.getElementById('livros-search-input');
          if (bookInput) { bookInput.value = query; filterLivrosList(); }
        }
      });
    }

    /**
     * Vincula botões globais e modais.
     */
    function bindGlobalButtons() {
      var btnQuickCreate = document.getElementById('btn-quick-create');
      if (btnQuickCreate) {
        btnQuickCreate.addEventListener('click', function () {
          UI.openModal('modal-quick-create');
        });
      }

      var btnRefreshDash = document.getElementById('btn-action-refresh-dash');
      if (btnRefreshDash) {
        btnRefreshDash.addEventListener('click', function () {
          loadDashboardData(btnRefreshDash);
        });
      }

      var btnSaveQuick = document.getElementById('btn-save-quick-record');
      if (btnSaveQuick) {
        btnSaveQuick.addEventListener('click', saveQuickRecord);
      }

      var btnCheckDb = document.getElementById('btn-check-db');
      if (btnCheckDb) {
        btnCheckDb.addEventListener('click', function () { checkDatabaseConnection(btnCheckDb); });
      }

      var btnSetupDb = document.getElementById('btn-setup-db');
      if (btnSetupDb) {
        btnSetupDb.addEventListener('click', function () { runSetupDatabase(btnSetupDb); });
      }

      var btnTestPersistence = document.getElementById('btn-test-persistence');
      if (btnTestPersistence) {
        btnTestPersistence.addEventListener('click', function () { runPersistenceTest(btnTestPersistence); });
      }
    }

    function setupSidebarControls() {
      var sidebar = document.getElementById('app-sidebar');
      var toggleBtn = document.getElementById('sidebar-toggle-btn');
      var mobileBtn = document.getElementById('mobile-menu-btn');

      if (toggleBtn && sidebar) {
        toggleBtn.addEventListener('click', function () {
          sidebar.classList.toggle('collapsed');
        });
      }

      if (mobileBtn && sidebar) {
        mobileBtn.addEventListener('click', function () {
          sidebar.classList.toggle('mobile-open');
        });
      }
    }

    function setupThemeToggle() {
      var btn = document.getElementById('theme-toggle-btn');
      if (btn) {
        btn.addEventListener('click', function () {
          UI.toggleTheme();
        });
      }
    }

    /* ==========================================================================
       DASHBOARD GERAL (MÉTRICAS E WIDGETS REAIS)
       ========================================================================== */

    function loadDashboardData(btnElement) {
      if (btnElement) UI.setLoading(btnElement, true, 'Atualizando...');

      ApiClient.call('apiGetDashboardStats')
        .then(function (stats) {
          if (btnElement) UI.setLoading(btnElement, false);
          if (!stats) return;
          renderDashboardKPIs(stats.kpis);
          renderDashboardWidgets(stats);
        })
        .catch(function (err) {
          if (btnElement) UI.setLoading(btnElement, false);
          console.warn('[Dashboard] Erro ao carregar estatísticas:', err.message);
        });
    }

    function syncFullPdi(btnElement) {
      if (btnElement) UI.setLoading(btnElement, true, 'Sincronizando 35 registros...');
      ApiClient.call('apiSeedFranciscoPdi', true)
        .then(function (report) {
          if (btnElement) UI.setLoading(btnElement, false);
          UI.showToast(
            'PDI Sincronizado e Validado!',
            'Total verificado na planilha: ' + (report.totalVerified || 35) + ' registros (Novos inseridos: ' + (report.seededNewCount || 0) + ').',
            'success',
            6000
          );
          loadDashboardData();
          checkDatabaseConnection();
        })
        .catch(function (err) {
          if (btnElement) UI.setLoading(btnElement, false);
          UI.showToast('Erro ao Sincronizar PDI', err.message, 'error');
        });
    }

    function renderDashboardKPIs(kpis) {
      if (!kpis) return;
      var elMetasConcluidas = document.getElementById('kpi-metas-concluidas');
      var elMetasAndamento = document.getElementById('kpi-metas-andamento');
      var elFeedbacksTotal = document.getElementById('kpi-feedbacks-total');
      var elLivrosTotal = document.getElementById('kpi-livros-total');

      if (elMetasConcluidas) elMetasConcluidas.textContent = kpis.metasConcluidas || 0;
      if (elMetasAndamento) elMetasAndamento.textContent = kpis.metasEmAndamento || 0;
      if (elFeedbacksTotal) elFeedbacksTotal.textContent = kpis.totalFeedbacks || 0;
      if (elLivrosTotal) elLivrosTotal.textContent = kpis.totalLivros || 0;
    }

    function renderDashboardWidgets(stats) {
      var metasContainer = document.getElementById('dash-metas-container');
      var feedbacksContainer = document.getElementById('dash-feedbacks-container');

      // Widget 1: Metas Prioritárias
      if (metasContainer) {
        if (!stats.priorityMetas || stats.priorityMetas.length === 0) {
          metasContainer.innerHTML = 
            '<div class="empty-state">' +
              '<div class="empty-state-icon">' + UI.ICONS['info'] + '</div>' +
              '<div class="empty-state-title">Nenhuma meta cadastrada</div>' +
              '<div class="empty-state-desc">Defina metas SMART para direcionar seu crescimento profissional.</div>' +
              '<button class="btn btn-secondary btn-sm" onclick="App.openCreateMetaModal()">Cadastrar Primeira Meta</button>' +
            '</div>';
        } else {
          var html = '<div style="display:flex; flex-direction:column; gap:0.75rem;">';
          for (var i = 0; i < stats.priorityMetas.length; i++) {
            var m = stats.priorityMetas[i];
            var prioridadeBadge = m.prioridade === 'alta' ? 'badge-error' : (m.prioridade === 'media' ? 'badge-warning' : 'badge-info');
            html += 
              '<div style="background:var(--bg-surface-elevated); padding:0.85rem 1rem; border-radius:var(--radius-md); border:1px solid var(--border-subtle); display:flex; align-items:center; justify-content:space-between; gap:1rem;">' +
                '<div>' +
                  '<div style="font-weight:600; font-size:0.92rem; color:var(--text-primary);">' + UI.escapeHtml(m.titulo) + '</div>' +
                  '<div style="font-size:0.78rem; color:var(--text-muted); margin-top:0.2rem;">Prazo: ' + (m.prazo || 'Sem prazo') + ' &bull; ' + UI.escapeHtml(m.objetivo_relacionado || 'Desenvolvimento') + '</div>' +
                '</div>' +
                '<span class="badge ' + prioridadeBadge + '">' + (m.prioridade || 'Média') + '</span>' +
              '</div>';
          }
          html += '</div>';
          metasContainer.innerHTML = html;
        }
      }

      // Widget 2: Feedbacks Recentes
      if (feedbacksContainer) {
        if (!stats.recentFeedbacks || stats.recentFeedbacks.length === 0) {
          feedbacksContainer.innerHTML = 
            '<div class="empty-state">' +
              '<div class="empty-state-icon">' + UI.ICONS['info'] + '</div>' +
              '<div class="empty-state-title">Nenhum feedback registrado</div>' +
              '<div class="empty-state-desc">Registre retornos recebidos para transformá-los em ações concretas.</div>' +
              '<button class="btn btn-secondary btn-sm" onclick="App.openCreateFeedbackModal()">Registrar Primeiro Feedback</button>' +
            '</div>';
        } else {
          var fbHtml = '<div style="display:flex; flex-direction:column; gap:0.75rem;">';
          for (var f = 0; f < stats.recentFeedbacks.length; f++) {
            var fb = stats.recentFeedbacks[f];
            fbHtml += 
              '<div style="background:var(--bg-surface-elevated); padding:0.85rem 1rem; border-radius:var(--radius-md); border:1px solid var(--border-subtle);">' +
                '<div style="display:flex; justify-content:space-between; align-items:flex-start; gap:0.5rem;">' +
                  '<div style="font-weight:600; font-size:0.92rem; color:var(--text-primary);">' + UI.escapeHtml(fb.titulo) + '</div>' +
                  '<span class="badge badge-info">' + UI.escapeHtml(fb.origem || 'Origem') + '</span>' +
                '</div>' +
                '<div style="font-size:0.78rem; color:var(--text-muted); margin-top:0.25rem;">Data: ' + (fb.data || '—') + ' &bull; Status: ' + (fb.status || 'novo') + '</div>' +
              '</div>';
          }
          fbHtml += '</div>';
          feedbacksContainer.innerHTML = fbHtml;
        }
      }
    }

    /* ==========================================================================
       1. MÓDULO: MEU PDI (PLANOS DE DESENVOLVIMENTO)
       ========================================================================== */

    function loadPdiList() {
      var container = document.getElementById('pdi-list-container');
      if (container) {
        container.innerHTML = '<div style="text-align:center; padding:2rem; color:var(--text-muted);"><span class="spinner"></span> Carregando planos PDI...</div>';
      }

      ApiClient.call('apiListRecords', 'PLANOS_PDI')
        .then(function (records) {
          state.pdiList = records || [];
          filterPdiList();
        })
        .catch(function (err) {
          if (container) {
            container.innerHTML = '<div class="empty-state"><div class="empty-state-title" style="color:var(--status-error);">Erro ao carregar Planos PDI</div><div class="empty-state-desc">' + UI.escapeHtml(err.message) + '</div></div>';
          }
        });
    }

    function filterPdiList() {
      var searchInput = document.getElementById('pdi-search-input');
      var statusSelect = document.getElementById('pdi-filter-status');
      var query = searchInput ? searchInput.value.trim().toLowerCase() : '';
      var statusFilter = statusSelect ? statusSelect.value : 'todos';

      var filtered = state.pdiList.filter(function (item) {
        var matchStatus = (statusFilter === 'todos') || (item.status === statusFilter);
        var textMatch = !query ||
          (item.titulo && item.titulo.toLowerCase().indexOf(query) !== -1) ||
          (item.cargo_desejado && item.cargo_desejado.toLowerCase().indexOf(query) !== -1) ||
          (item.objetivo_profissional && item.objetivo_profissional.toLowerCase().indexOf(query) !== -1);
        return matchStatus && textMatch;
      });

      renderPdiCards(filtered);
    }

    function renderPdiCards(list) {
      var container = document.getElementById('pdi-list-container');
      if (!container) return;

      if (!list || list.length === 0) {
        container.innerHTML = 
          '<div class="empty-state">' +
            '<div class="empty-state-icon">' + UI.ICONS['info'] + '</div>' +
            '<div class="empty-state-title">Nenhum plano PDI encontrado</div>' +
            '<div class="empty-state-desc">Cadastre seu primeiro Plano de Desenvolvimento Individual para estruturar sua jornada profissional.</div>' +
            '<button class="btn btn-primary btn-sm" onclick="App.openCreatePdiModal()">+ Novo Plano PDI</button>' +
          '</div>';
        return;
      }

      var html = '<div style="display:flex; flex-direction:column; gap:1.25rem;">';
      for (var i = 0; i < list.length; i++) {
        var p = list[i];
        var statusBadge = p.status === 'ativo' ? 'badge-success' : (p.status === 'concluido' ? 'badge-violet' : 'badge-warning');

        html += 
          '<div class="content-card" style="margin-bottom:0;">' +
            '<div style="display:flex; justify-content:space-between; align-items:flex-start; gap:1rem; flex-wrap:wrap;">' +
              '<div>' +
                '<div style="display:flex; align-items:center; gap:0.5rem; margin-bottom:0.25rem;">' +
                  '<h2 style="font-size:1.2rem; font-weight:700; color:var(--text-primary);">' + UI.escapeHtml(p.titulo) + '</h2>' +
                  '<span class="badge ' + statusBadge + '">' + (p.status || 'Ativo').toUpperCase() + '</span>' +
                '</div>' +
                '<div style="font-size:0.88rem; color:var(--accent-violet); font-weight:600;">Cargo / Área Alvo: ' + UI.escapeHtml(p.cargo_desejado || 'Não informado') + '</div>' +
              '</div>' +
              '<div style="display:flex; gap:0.5rem;">' +
                '<button class="btn btn-secondary btn-sm" onclick="App.openEditPdiModal(\'' + p.id + '\')">Editar</button>' +
                '<button class="btn btn-outline btn-sm" style="color:#ef4444; border-color:rgba(239,68,68,0.4);" onclick="App.requestDeleteRecord(\'PLANOS_PDI\', \'' + p.id + '\', \'' + UI.escapeHtml(p.titulo) + '\')">Excluir</button>' +
              '</div>' +
            '</div>' +

            '<div style="margin:1rem 0; font-size:0.9rem; color:var(--text-secondary); line-height:1.5;">' +
              '<strong>Objetivo Estratégico:</strong> ' + UI.escapeHtml(p.objetivo_profissional || '—') +
            '</div>';

        if (p.pontos_fortes || p.oportunidades_melhoria) {
          html += '<div class="form-row" style="margin-bottom:0.85rem;">';
          if (p.pontos_fortes) {
            html += '<div style="background:var(--bg-surface-elevated); padding:0.75rem; border-radius:var(--radius-md); border:1px solid var(--border-subtle);">' +
              '<div style="font-size:0.75rem; font-weight:700; text-transform:uppercase; color:var(--status-success); margin-bottom:0.35rem;">Pontos Fortes (Forças)</div>' +
              '<div style="font-size:0.83rem; color:var(--text-primary);">' + UI.escapeHtml(p.pontos_fortes) + '</div>' +
            '</div>';
          }
          if (p.oportunidades_melhoria) {
            html += '<div style="background:var(--bg-surface-elevated); padding:0.75rem; border-radius:var(--radius-md); border:1px solid var(--border-subtle);">' +
              '<div style="font-size:0.75rem; font-weight:700; text-transform:uppercase; color:#f59e0b; margin-bottom:0.35rem;">Oportunidades de Melhoria (Gaps)</div>' +
              '<div style="font-size:0.83rem; color:var(--text-primary);">' + UI.escapeHtml(p.oportunidades_melhoria) + '</div>' +
            '</div>';
          }
          html += '</div>';
        }

        html += 
            '<div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; font-size:0.78rem; color:var(--text-muted); border-top:1px solid var(--border-subtle); padding-top:0.75rem; margin-top:0.5rem;">' +
              '<div>Início: ' + (p.data_inicio || '—') + ' &bull; Prazo: ' + (p.prazo_final || '—') + '</div>' +
              '<div>Indicadores: ' + UI.escapeHtml(p.indicadores_sucesso || 'Em definição') + '</div>' +
            '</div>' +
          '</div>';
      }
      html += '</div>';
      container.innerHTML = html;
    }

    function openCreatePdiModal() {
      document.getElementById('pdi-modal-title').textContent = 'Novo Plano de Desenvolvimento Individual';
      document.getElementById('pdi-field-id').value = '';
      document.getElementById('pdi-field-titulo').value = '';
      document.getElementById('pdi-field-cargo').value = '';
      document.getElementById('pdi-field-objetivo').value = '';
      document.getElementById('pdi-field-pontos-fortes').value = '';
      document.getElementById('pdi-field-melhorias').value = '';
      document.getElementById('pdi-field-inicio').value = new Date().toISOString().split('T')[0];
      document.getElementById('pdi-field-prazo').value = '';
      document.getElementById('pdi-field-status').value = 'ativo';
      document.getElementById('pdi-field-indicadores').value = '';
      document.getElementById('pdi-field-observacoes').value = '';
      UI.openModal('modal-pdi-form');
    }

    function openEditPdiModal(id) {
      var item = state.pdiList.find(function (p) { return p.id === id; });
      if (!item) return;

      document.getElementById('pdi-modal-title').textContent = 'Editar Plano PDI';
      document.getElementById('pdi-field-id').value = item.id;
      document.getElementById('pdi-field-titulo').value = item.titulo || '';
      document.getElementById('pdi-field-cargo').value = item.cargo_desejado || '';
      document.getElementById('pdi-field-objetivo').value = item.objetivo_profissional || '';
      document.getElementById('pdi-field-pontos-fortes').value = item.pontos_fortes || '';
      document.getElementById('pdi-field-melhorias').value = item.oportunidades_melhoria || '';
      document.getElementById('pdi-field-inicio').value = item.data_inicio || '';
      document.getElementById('pdi-field-prazo').value = item.prazo_final || '';
      document.getElementById('pdi-field-status').value = item.status || 'ativo';
      document.getElementById('pdi-field-indicadores').value = item.indicadores_sucesso || '';
      document.getElementById('pdi-field-observacoes').value = item.observacoes || '';
      UI.openModal('modal-pdi-form');
    }

    function savePdiRecord() {
      var btn = document.getElementById('btn-save-pdi');
      var id = document.getElementById('pdi-field-id').value;
      var titulo = document.getElementById('pdi-field-titulo').value.trim();
      var cargo = document.getElementById('pdi-field-cargo').value.trim();
      var objetivo = document.getElementById('pdi-field-objetivo').value.trim();

      if (!titulo || !cargo || !objetivo) {
        UI.showToast('Campos Obrigatórios', 'Preencha o título, cargo desejado e objetivo profissional.', 'warning');
        return;
      }

      var recordData = {
        titulo: titulo,
        cargo_desejado: cargo,
        objetivo_profissional: objetivo,
        pontos_fortes: document.getElementById('pdi-field-pontos-fortes').value.trim(),
        oportunidades_melhoria: document.getElementById('pdi-field-melhorias').value.trim(),
        data_inicio: document.getElementById('pdi-field-inicio').value,
        prazo_final: document.getElementById('pdi-field-prazo').value,
        status: document.getElementById('pdi-field-status').value,
        indicadores_sucesso: document.getElementById('pdi-field-indicadores').value.trim(),
        observacoes: document.getElementById('pdi-field-observacoes').value.trim()
      };

      UI.setLoading(btn, true, 'Salvando...');
      var promise = id ? ApiClient.call('apiUpdateRecord', 'PLANOS_PDI', id, recordData) : ApiClient.call('apiCreateRecord', 'PLANOS_PDI', recordData);

      promise
        .then(function () {
          UI.setLoading(btn, false);
          UI.closeModal('modal-pdi-form');
          UI.showToast('Sucesso', 'Plano PDI salvo com sucesso na sua planilha!', 'success');
          loadPdiList();
          loadDashboardData();
        })
        .catch(function (err) {
          UI.setLoading(btn, false);
          UI.showToast('Erro ao Salvar', err.message, 'error');
        });
    }

    /* ==========================================================================
       1.5. MÓDULO: MÉTODO SWOT (ANÁLISE FOFA 2x2)
       ========================================================================== */

    function loadSwotList() {
      var quads = ['forca', 'fraqueza', 'oportunidade', 'ameaca'];
      for (var q = 0; q < quads.length; q++) {
        var el = document.getElementById('swot-list-' + quads[q]);
        if (el) {
          el.innerHTML = '<div style="text-align:center; padding:1.5rem; color:var(--text-muted); font-size:0.85rem;"><span class="spinner"></span> Carregando...</div>';
        }
      }

      ApiClient.call('apiListRecords', 'SWOT')
        .then(function (records) {
          state.swotList = (records || []).filter(function (r) {
            return r.status !== 'arquivado';
          });
          filterSwotList();
        })
        .catch(function (err) {
          for (var i = 0; i < quads.length; i++) {
            var container = document.getElementById('swot-list-' + quads[i]);
            if (container) {
              container.innerHTML = '<div class="empty-state" style="padding:1.5rem;"><div class="empty-state-title" style="color:var(--status-error); font-size:0.9rem;">Erro ao carregar SWOT</div><div class="empty-state-desc">' + UI.escapeHtml(err.message) + '</div></div>';
            }
          }
        });
    }

    function filterSwotList() {
      var searchInput = document.getElementById('swot-search-input');
      var impactoSelect = document.getElementById('swot-filter-impacto');
      var statusSelect = document.getElementById('swot-filter-status');

      var query = searchInput ? searchInput.value.trim().toLowerCase() : '';
      var impactoFilter = impactoSelect ? impactoSelect.value : 'todos';
      var statusFilter = statusSelect ? statusSelect.value : 'todos';

      // Atualiza contadores totais nos cards de topo
      var totalForca = 0;
      var totalFraqueza = 0;
      var totalOportunidade = 0;
      var totalAmeaca = 0;

      for (var c = 0; c < state.swotList.length; c++) {
        var qType = String(state.swotList[c].quadrante || '').toLowerCase();
        if (qType === 'forca') totalForca++;
        else if (qType === 'fraqueza') totalFraqueza++;
        else if (qType === 'oportunidade') totalOportunidade++;
        else if (qType === 'ameaca') totalAmeaca++;
      }

      var countForcaEl = document.getElementById('swot-count-forca');
      var countFraquezaEl = document.getElementById('swot-count-fraqueza');
      var countOportunidadeEl = document.getElementById('swot-count-oportunidade');
      var countAmeacaEl = document.getElementById('swot-count-ameaca');

      if (countForcaEl) countForcaEl.textContent = totalForca;
      if (countFraquezaEl) countFraquezaEl.textContent = totalFraqueza;
      if (countOportunidadeEl) countOportunidadeEl.textContent = totalOportunidade;
      if (countAmeacaEl) countAmeacaEl.textContent = totalAmeaca;

      var filtered = state.swotList.filter(function (item) {
        var matchImpacto = (impactoFilter === 'todos') || (item.impacto === impactoFilter);
        var matchStatus = (statusFilter === 'todos') || (item.status === statusFilter);
        var textMatch = !query ||
          (item.titulo && item.titulo.toLowerCase().indexOf(query) !== -1) ||
          (item.descricao && item.descricao.toLowerCase().indexOf(query) !== -1) ||
          (item.estrategia_cruzada && item.estrategia_cruzada.toLowerCase().indexOf(query) !== -1) ||
          (item.competencia_relacionada && item.competencia_relacionada.toLowerCase().indexOf(query) !== -1);

        return matchImpacto && matchStatus && textMatch;
      });

      renderSwotMatrix(filtered);
    }

    function renderSwotMatrix(list) {
      var quadrantConfigs = [
        { key: 'forca', emptyTitle: 'Nenhuma Força mapeada', emptyDesc: 'Adicione seus pontos fortes, talentos e diferenciais técnicos ou comportamentais.', btnLabel: '+ Adicionar Força' },
        { key: 'fraqueza', emptyTitle: 'Nenhuma Fraqueza mapeada', emptyDesc: 'Identifique lacunas ou pontos internos que precisam de evolução no seu PDI.', btnLabel: '+ Adicionar Fraqueza' },
        { key: 'oportunidade', emptyTitle: 'Nenhuma Oportunidade mapeada', emptyDesc: 'Registre tendências do mercado, novos projetos ou aberturas na carreira.', btnLabel: '+ Adicionar Oportunidade' },
        { key: 'ameaca', emptyTitle: 'Nenhuma Ameaça mapeada', emptyDesc: 'Antecipe riscos externos, mudanças tecnológicas ou obstáculos do ambiente.', btnLabel: '+ Adicionar Ameaça' }
      ];

      for (var q = 0; q < quadrantConfigs.length; q++) {
        var cfg = quadrantConfigs[q];
        var container = document.getElementById('swot-list-' + cfg.key);
        var badgeEl = document.getElementById('swot-badge-' + cfg.key);
        if (!container) continue;

        var items = list.filter(function (item) {
          return String(item.quadrante || '').toLowerCase() === cfg.key;
        });

        if (badgeEl) badgeEl.textContent = items.length;

        if (items.length === 0) {
          container.innerHTML =
            '<div class="empty-state" style="padding: 1.75rem 1rem;">' +
              '<div class="empty-state-title" style="font-size: 0.92rem;">' + cfg.emptyTitle + '</div>' +
              '<div class="empty-state-desc" style="font-size: 0.8rem; margin-bottom: 0.85rem;">' + cfg.emptyDesc + '</div>' +
              '<button class="btn btn-secondary btn-sm" onclick="App.openCreateSwotModal(\'' + cfg.key + '\')">' + cfg.btnLabel + '</button>' +
            '</div>';
          continue;
        }

        var html = '';
        for (var i = 0; i < items.length; i++) {
          var s = items[i];
          var impBadge = s.impacto === 'alto' ? 'badge-error' : (s.impacto === 'medio' ? 'badge-warning' : 'badge-info');
          var impLabel = s.impacto === 'alto' ? 'Impacto Alto' : (s.impacto === 'medio' ? 'Impacto Médio' : 'Impacto Baixo');

          var statusBadge = 'badge-info';
          var statusLabel = 'Ativo';
          if (s.status === 'em_acao') {
            statusBadge = 'badge-violet';
            statusLabel = 'Em Ação no PDI';
          } else if (s.status === 'resolvido') {
            statusBadge = 'badge-success';
            statusLabel = 'Consolidado';
          }

          html +=
            '<div class="swot-item-card">' +
              '<div class="swot-item-top">' +
                '<div class="swot-item-title">' + UI.escapeHtml(s.titulo) + '</div>' +
                '<div style="display:flex; gap:0.35rem; flex-shrink:0; flex-wrap:wrap;">' +
                  '<span class="badge ' + impBadge + '">' + impLabel + '</span>' +
                  '<span class="badge ' + statusBadge + '">' + statusLabel + '</span>' +
                '</div>' +
              '</div>' +
              (s.descricao ? '<div class="swot-item-desc">' + UI.escapeHtml(s.descricao) + '</div>' : '') +
              (s.estrategia_cruzada ? '<div class="swot-item-strategy"><strong>Estratégia:</strong> ' + UI.escapeHtml(s.estrategia_cruzada) + '</div>' : '') +
              '<div class="swot-item-footer">' +
                '<div>' +
                  (s.competencia_relacionada ? '<span class="tag-pill" style="margin:0;">🎯 ' + UI.escapeHtml(s.competencia_relacionada) + '</span>' : '<span style="font-size:0.74rem; color:var(--text-muted);">Fator estratégico</span>') +
                '</div>' +
                '<div style="display:flex; gap:0.4rem; align-items:center;">' +
                  '<button class="btn btn-primary btn-sm" style="padding:0.25rem 0.6rem; font-size:0.75rem;" onclick="App.openConvertSwotModal(\'' + s.id + '\')">+ Criar Ação</button>' +
                  '<button class="btn btn-secondary btn-sm" style="padding:0.25rem 0.6rem; font-size:0.75rem;" onclick="App.openEditSwotModal(\'' + s.id + '\')">Editar</button>' +
                  '<button class="btn btn-outline btn-sm" style="padding:0.25rem 0.55rem; font-size:0.75rem; color:#ef4444; border-color:rgba(239,68,68,0.4);" onclick="App.requestDeleteRecord(\'SWOT\', \'' + s.id + '\', \'' + UI.escapeHtml(s.titulo) + '\')">Excluir</button>' +
                '</div>' +
              '</div>' +
            '</div>';
        }
        container.innerHTML = html;
      }
    }

    function loadSkillsList() {
      var container = document.getElementById('skills-list-container');
      if (container) {
        container.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:2rem; color:var(--text-muted);"><span class="spinner"></span> Carregando competências...</div>';
      }

      ApiClient.call('apiListRecords', 'COMPETENCIAS')
        .then(function (records) {
          state.skillsList = records || [];
          filterSkillsList();
        })
        .catch(function (err) {
          if (container) {
            container.innerHTML = '<div style="grid-column:1/-1;" class="empty-state"><div class="empty-state-title" style="color:var(--status-error);">Erro ao carregar competências</div><div class="empty-state-desc">' + UI.escapeHtml(err.message) + '</div></div>';
          }

    function filterSkillsList() {
      var searchInput = document.getElementById('skills-search-input');
      var tipoSelect = document.getElementById('skills-filter-tipo');
      var gapSelect = document.getElementById('skills-filter-gap');

      var query = searchInput ? searchInput.value.trim().toLowerCase() : '';
      var tipoFilter = tipoSelect ? tipoSelect.value : 'todos';
      var gapFilter = gapSelect ? gapSelect.value : 'todos';

      var filtered = state.skillsList.filter(function (item) {
        var matchTipo = (tipoFilter === 'todos') || (item.tipo === tipoFilter);
        var atual = Number(item.nivel_atual) || 1;
        var desejado = Number(item.nivel_desejado) || 1;
        var gap = Math.max(0, desejado - atual);

        var matchGap = true;
        if (gapFilter === 'com_gap') matchGap = gap > 0;
        if (gapFilter === 'sem_gap') matchGap = gap === 0;

        var textMatch = !query ||
          (item.nome && item.nome.toLowerCase().indexOf(query) !== -1) ||
          (item.categoria && item.categoria.toLowerCase().indexOf(query) !== -1);

        return matchTipo && matchGap && textMatch;
      });

      renderSkillsCards(filtered);
    }

    function renderSkillsCards(list) {
      var container = document.getElementById('skills-list-container');
      if (!container) return;

      if (!list || list.length === 0) {
        container.innerHTML = 
          '<div style="grid-column:1/-1;" class="empty-state">' +
            '<div class="empty-state-icon">' + UI.ICONS['info'] + '</div>' +
            '<div class="empty-state-title">Nenhuma competência cadastrada</div>' +
            '<div class="empty-state-desc">Cadastre suas competências técnicas e comportamentais para mapear gaps e guiar seu desenvolvimento.</div>' +
            '<button class="btn btn-primary btn-sm" onclick="App.openCreateSkillModal()">+ Nova Competência</button>' +
          '</div>';
        return;
      }

      var html = '';
      for (var i = 0; i < list.length; i++) {
        var s = list[i];
        var atual = Math.min(5, Math.max(1, Number(s.nivel_atual) || 1));
        var desejado = Math.min(5, Math.max(1, Number(s.nivel_desejado) || 1));
        var gap = Math.max(0, desejado - atual);

        var tipoBadge = s.tipo === 'hard_skill' ? '<span class="badge badge-info">Hard Skill</span>' : '<span class="badge badge-violet">Soft Skill</span>';
        var gapBadge = gap > 0 
          ? '<span class="badge badge-warning">Lacuna: +' + gap + ' níveis</span>'
          : '<span class="badge badge-success">Meta Atingida</span>';

        var pctAtual = (atual / 5) * 100;
        var pctDesejado = (desejado / 5) * 100;

        html += 
          '<div class="skill-card">' +
            '<div>' +
              '<div class="skill-card-top">' +
                '<div>' +
                  '<div class="skill-name">' + UI.escapeHtml(s.nome) + '</div>' +
                  '<div class="skill-category">' + UI.escapeHtml(s.categoria || 'Geral') + '</div>' +
                '</div>' +
                '<div>' + tipoBadge + '</div>' +
              '</div>' +

              '<div style="margin-bottom:0.75rem;">' + gapBadge + '</div>' +

              '<div class="skill-scale-bar">' +
                '<div class="skill-scale-labels">' +
                  '<span>Atual: Nível ' + atual + '/5</span>' +
                  '<span>Alvo: Nível ' + desejado + '/5</span>' +
                '</div>' +
                '<div class="skill-track">' +
                  '<div class="skill-fill-target" style="width:' + pctDesejado + '%;"></div>' +
                  '<div class="skill-fill-current" style="width:' + pctAtual + '%;"></div>' +
                '</div>' +
              '</div>' +

              (s.descricao ? '<p style="font-size:0.83rem; color:var(--text-secondary); margin-bottom:0.75rem; line-height:1.4;">' + UI.escapeHtml(s.descricao) + '</p>' : '') +
              (s.meta_desenvolvimento ? '<div style="font-size:0.78rem; color:var(--text-muted); background:var(--bg-surface-elevated); padding:0.5rem; border-radius:var(--radius-sm); margin-bottom:0.75rem;"><strong>Plano:</strong> ' + UI.escapeHtml(s.meta_desenvolvimento) + '</div>' : '') +
            '</div>' +

            '<div style="display:flex; justify-content:space-between; align-items:center; border-top:1px solid var(--border-subtle); padding-top:0.75rem; margin-top:0.5rem;">' +
              '<button class="btn btn-outline btn-sm" onclick="App.openEvaluateSkillModal(\'' + s.id + '\')">Avaliar Nível</button>' +
              '<div style="display:flex; gap:0.4rem;">' +
                '<button class="btn btn-secondary btn-sm" onclick="App.openEditSkillModal(\'' + s.id + '\')">Editar</button>' +
                '<button class="btn btn-outline btn-sm" style="color:#ef4444; border-color:rgba(239,68,68,0.4);" onclick="App.requestDeleteRecord(\'COMPETENCIAS\', \'' + s.id + '\', \'' + UI.escapeHtml(s.nome) + '\')">Excluir</button>' +
              '</div>' +
            '</div>' +
          '</div>';
      }
      container.innerHTML = html;
    }

    /* ==========================================================================
       3. MÓDULO: METAS & AÇÕES DE DESENVOLVIMENTO
       ========================================================================== */

    function loadMetasList() {
      var container = document.getElementById('metas-list-container');
      if (container) {
        container.innerHTML = '<div style="text-align:center; padding:2rem; color:var(--text-muted);"><span class="spinner"></span> Carregando metas e ações...</div>';
      }

      Promise.all([
        ApiClient.call('apiListRecords', 'METAS'),
        ApiClient.call('apiListRecords', 'ACOES')
      ])
        .then(function (results) {
          state.metasList = results[0] || [];
          state.acoesList = results[1] || [];
          checkMetasDeadlines();
          filterMetasList();
        })
        .catch(function (err) {
          if (container) {
            container.innerHTML = '<div class="empty-state"><div class="empty-state-title" style="color:var(--status-error);">Erro ao carregar metas</div><div class="empty-state-desc">' + UI.escapeHtml(err.message) + '</div></div>';
          }
        });
    }

    function checkMetasDeadlines() {
      var banner = document.getElementById('metas-alert-banner');
      var alertText = document.getElementById('metas-alert-text');
      if (!banner || !alertText) return;

      var hoje = new Date().toISOString().split('T')[0];
      var metasAtrasadas = 0;
      var acoesVencendo = 0;

      for (var m = 0; m < state.metasList.length; m++) {
        var meta = state.metasList[m];
        if (meta.status !== 'concluida' && meta.status !== 'cancelada' && meta.prazo && meta.prazo < hoje) {
          metasAtrasadas++;
        }
      }

      if (metasAtrasadas > 0) {
        banner.style.display = 'flex';
        alertText.textContent = 'Atenção: Você possui ' + metasAtrasadas + ' meta(s) com prazo vencido que necessitam de revisão!';
      } else {
        banner.style.display = 'none';
      }
    }

    function filterMetasList() {
      var searchInput = document.getElementById('metas-search-input');
      var statusSelect = document.getElementById('metas-filter-status');
      var prioridadeSelect = document.getElementById('metas-filter-prioridade');

      var query = searchInput ? searchInput.value.trim().toLowerCase() : '';
      var statusFilter = statusSelect ? statusSelect.value : 'todos';
      var prioridadeFilter = prioridadeSelect ? prioridadeSelect.value : 'todos';
      var hoje = new Date().toISOString().split('T')[0];

      var filtered = state.metasList.filter(function (item) {
        var matchStatus = true;
        if (statusFilter === 'atrasada') {
          matchStatus = (item.status !== 'concluida' && item.prazo && item.prazo < hoje);
        } else if (statusFilter !== 'todos') {
          matchStatus = (item.status === statusFilter);
        }

        var matchPrioridade = (prioridadeFilter === 'todos') || (item.prioridade === prioridadeFilter);
        var textMatch = !query ||
          (item.titulo && item.titulo.toLowerCase().indexOf(query) !== -1) ||
          (item.descricao && item.descricao.toLowerCase().indexOf(query) !== -1) ||
          (item.objetivo_relacionado && item.objetivo_relacionado.toLowerCase().indexOf(query) !== -1);

        return matchStatus && matchPrioridade && textMatch;
      });

      renderMetasCards(filtered);
    }

    function renderMetasCards(list) {
      var container = document.getElementById('metas-list-container');
      if (!container) return;

      if (!list || list.length === 0) {
        container.innerHTML = 
          '<div class="empty-state">' +
            '<div class="empty-state-icon">' + UI.ICONS['info'] + '</div>' +
            '<div class="empty-state-title">Nenhuma meta SMART encontrada</div>' +
            '<div class="empty-state-desc">Defina metas estruturadas e vincule ações práticas para acompanhar sua evolução.</div>' +
            '<button class="btn btn-primary btn-sm" onclick="App.openCreateMetaModal()">+ Nova Meta SMART</button>' +
          '</div>';
        return;
      }

      var hoje = new Date().toISOString().split('T')[0];
      var html = '<div style="display:flex; flex-direction:column; gap:1.25rem;">';

      for (var i = 0; i < list.length; i++) {
        var m = list[i];
        var isAtrasada = (m.status !== 'concluida' && m.status !== 'cancelada' && m.prazo && m.prazo < hoje);

        // Ações vinculadas a esta meta
        var childAcoes = state.acoesList.filter(function (a) { return a.meta_id === m.id; });
        var totalAcoes = childAcoes.length;
        var concluidas = childAcoes.filter(function (a) { return a.status === 'concluida'; }).length;

        // Regra clara de progresso: % de ações concluídas
        var pctProgresso = totalAcoes > 0 ? Math.round((concluidas / totalAcoes) * 100) : (m.status === 'concluida' ? 100 : 0);

        var prioridadeBadge = m.prioridade === 'alta' ? 'badge-error' : (m.prioridade === 'media' ? 'badge-warning' : 'badge-info');
        var statusBadge = m.status === 'concluida' ? 'badge-success' : (m.status === 'planejada' ? 'badge-info' : 'badge-violet');

        html += 
          '<div class="goal-card">' +
            '<div class="goal-header">' +
              '<div>' +
                '<div style="display:flex; align-items:center; gap:0.5rem; flex-wrap:wrap; margin-bottom:0.25rem;">' +
                  '<div class="goal-title">' + UI.escapeHtml(m.titulo) + '</div>' +
                  '<span class="badge ' + statusBadge + '">' + (m.status || 'Em Andamento').toUpperCase() + '</span>' +
                  '<span class="badge ' + prioridadeBadge + '">' + (m.prioridade || 'Média') + '</span>' +
                  (isAtrasada ? '<span class="badge badge-error">Atrasada</span>' : '') +
                '</div>' +
                '<div style="font-size:0.83rem; color:var(--text-muted);">' +
                  'Início: ' + (m.data_inicial || '—') + ' &bull; Prazo: ' + (m.prazo || 'Sem prazo') + ' &bull; Área: ' + UI.escapeHtml(m.objetivo_relacionado || 'Geral') +
                '</div>' +
              '</div>' +
              '<div style="display:flex; gap:0.5rem;">' +
                '<button class="btn btn-secondary btn-sm" onclick="App.openEditMetaModal(\'' + m.id + '\')">Editar</button>' +
                '<button class="btn btn-outline btn-sm" style="color:#ef4444; border-color:rgba(239,68,68,0.4);" onclick="App.requestDeleteRecord(\'METAS\', \'' + m.id + '\', \'' + UI.escapeHtml(m.titulo) + '\')">Excluir</button>' +
              '</div>' +
            '</div>' +

            '<div class="goal-progress-wrap">' +
              '<div style="display:flex; justify-content:space-between; font-size:0.82rem; font-weight:600; color:var(--text-secondary); margin-bottom:0.35rem;">' +
                '<span>Progresso: ' + pctProgresso + '%</span>' +
                '<span>' + concluidas + ' de ' + totalAcoes + ' ações concluídas</span>' +
              '</div>' +
              '<div class="progress-bar-bg">' +
                '<div class="progress-bar-fill" style="width:' + pctProgresso + '%;"></div>' +
              '</div>' +
            '</div>' +

            (m.resultado_esperado ? '<div style="font-size:0.85rem; color:var(--text-secondary); margin-bottom:0.5rem;"><strong>Resultado Esperado:</strong> ' + UI.escapeHtml(m.resultado_esperado) + '</div>' : '') +
            (m.indicador ? '<div style="font-size:0.82rem; color:var(--text-muted); margin-bottom:0.75rem;"><strong>Indicador de Sucesso:</strong> ' + UI.escapeHtml(m.indicador) + '</div>' : '') +

            // Lista de Ações Vinculadas
            '<div class="actions-list">' +
              '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.4rem;">' +
                '<span style="font-size:0.82rem; font-weight:700; color:var(--text-secondary); text-transform:uppercase;">Plano de Ações Vinculadas</span>' +
                '<button class="btn btn-outline btn-sm" style="padding:0.2rem 0.6rem; font-size:0.75rem;" onclick="App.openAddAcaoModal(\'' + m.id + '\')">+ Adicionar Ação</button>' +
              '</div>';

        if (childAcoes.length === 0) {
          html += '<div style="font-size:0.82rem; color:var(--text-muted); padding:0.5rem 0;">Nenhuma ação cadastrada para esta meta. Clique em "+ Adicionar Ação" acima.</div>';
        } else {
          for (var a = 0; a < childAcoes.length; a++) {
            var acao = childAcoes[a];
            var isConcluida = (acao.status === 'concluida');
            var isAcaoAtrasada = (!isConcluida && acao.prazo && acao.prazo < hoje);

            html += 
              '<div class="action-row">' +
                '<div style="display:flex; align-items:center; gap:0.6rem; flex:1;">' +
                  '<input type="checkbox" ' + (isConcluida ? 'checked' : '') + ' onchange="App.toggleAcaoStatus(\'' + acao.id + '\', this.checked)" style="cursor:pointer; width:16px; height:16px;" />' +
                  '<span style="' + (isConcluida ? 'text-decoration:line-through; opacity:0.6;' : '') + ' font-weight:500;">' + UI.escapeHtml(acao.titulo) + '</span>' +
                  (isAcaoAtrasada ? '<span class="badge badge-error" style="font-size:0.68rem; padding:0.1rem 0.35rem;">Atrasada</span>' : '') +
                '</div>' +
                '<div style="display:flex; align-items:center; gap:0.75rem; font-size:0.78rem; color:var(--text-muted);">' +
                  '<span>Prazo: ' + (acao.prazo || '—') + '</span>' +
                  '<button style="background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:1rem; padding:0 0.25rem;" title="Remover Ação" onclick="App.requestDeleteRecord(\'ACOES\', \'' + acao.id + '\', \'' + UI.escapeHtml(acao.titulo) + '\')">&times;</button>' +
                '</div>' +
              '</div>';
          }
        }

        html += '</div></div>';
      }
      html += '</div>';
      container.innerHTML = html;
    }

    function saveMetaRecord() {
      var btn = document.getElementById('btn-save-meta');
      var id = document.getElementById('meta-field-id').value;
      var titulo = document.getElementById('meta-field-titulo').value.trim();
      var prazo = document.getElementById('meta-field-prazo').value;

      if (!titulo || !prazo) {
        UI.showToast('Campos Obrigatórios', 'Preencha o título e o prazo final da meta.', 'warning');
        return;
      }

      var recordData = {
        titulo: titulo,
        objetivo_relacionado: document.getElementById('meta-field-objetivo').value.trim(),
        prioridade: document.getElementById('meta-field-prioridade').value,
        data_inicial: document.getElementById('meta-field-inicio').value,
        prazo: prazo,
        status: document.getElementById('meta-field-status').value,
        indicador: document.getElementById('meta-field-indicador').value.trim(),
        resultado_esperado: document.getElementById('meta-field-resultado').value.trim(),
        descricao: document.getElementById('meta-field-descricao').value.trim()
      };

      UI.setLoading(btn, true, 'Salvando...');
      var promise = id ? ApiClient.call('apiUpdateRecord', 'METAS', id, recordData) : ApiClient.call('apiCreateRecord', 'METAS', recordData);

      promise
        .then(function () {
          UI.setLoading(btn, false);
          UI.closeModal('modal-meta-form');
          UI.showToast('Sucesso', 'Meta salva com sucesso!', 'success');
          loadMetasList();
          loadDashboardData();
        })
        .catch(function (err) {
          UI.setLoading(btn, false);
          UI.showToast('Erro ao Salvar', err.message, 'error');
        });
    }

      document.getElementById('acao-field-titulo').value = '';
      document.getElementById('acao-field-prazo').value = '';
      document.getElementById('acao-field-prioridade').value = 'alta';
      document.getElementById('acao-field-status').value = 'a_fazer';

    function toggleAcaoStatus(acaoId, isChecked) {
      var novoStatus = isChecked ? 'concluida' : 'a_fazer';
      ApiClient.call('apiUpdateRecord', 'ACOES', acaoId, { status: novoStatus })
        .then(function () {
          UI.showToast('Ação Atualizada', 'Status alterado para ' + (isChecked ? 'Concluída' : 'A Fazer'), 'info', 2000);
          loadMetasList();
          loadDashboardData();
        })
        .catch(function (err) {
          UI.showToast('Erro ao Atualizar', err.message, 'error');
          loadMetasList();
        });
    }

    function loadFeedbacksList() {

      ApiClient.call('apiListRecords', 'FEEDBACKS')

          state.feedbacksList = records || [];

        });

    function filterFeedbacksList() {
      var searchInput = document.getElementById('feedbacks-search-input');
      var statusSelect = document.getElementById('feedbacks-filter-status');

      var query = searchInput ? searchInput.value.trim().toLowerCase() : '';
      var statusFilter = statusSelect ? statusSelect.value : 'todos';

      var filtered = state.feedbacksList.filter(function (item) {
        var matchStatus = (statusFilter === 'todos') || (item.status === statusFilter);
        var textMatch = !query ||
          (item.titulo && item.titulo.toLowerCase().indexOf(query) !== -1) ||
          (item.origem && item.origem.toLowerCase().indexOf(query) !== -1) ||
          (item.descricao && item.descricao.toLowerCase().indexOf(query) !== -1) ||
          (item.pontos_fortes && item.pontos_fortes.toLowerCase().indexOf(query) !== -1) ||
          (item.oportunidades_melhoria && item.oportunidades_melhoria.toLowerCase().indexOf(query) !== -1);

        return matchStatus && textMatch;
      });

      renderFeedbacksCards(filtered);
    }

    function saveFeedbackRecord() {
      var btn = document.getElementById('btn-save-feedback');
      var id = document.getElementById('feedback-field-id').value;
      var titulo = document.getElementById('feedback-field-titulo').value.trim();
      var origem = document.getElementById('feedback-field-origem').value.trim();
      var data = document.getElementById('feedback-field-data').value;

      if (!titulo || !origem || !data) {
        UI.showToast('Campos Obrigatórios', 'Preencha o título, origem e data do feedback.', 'warning');
        return;
      }

      var recordData = {
        titulo: titulo,
        origem: origem,
        data: data,
        status: document.getElementById('feedback-field-status').value,
        prioridade: document.getElementById('feedback-field-prioridade').value,
        contexto: document.getElementById('feedback-field-contexto').value.trim(),
        pontos_fortes: document.getElementById('feedback-field-pontos-fortes').value.trim(),
        oportunidades_melhoria: document.getElementById('feedback-field-melhorias').value.trim(),
        acoes_acordadas: document.getElementById('feedback-field-acoes').value.trim(),
        prazo_acompanhamento: document.getElementById('feedback-field-prazo').value
      };

      UI.setLoading(btn, true, 'Salvando...');
      var promise = id ? ApiClient.call('apiUpdateRecord', 'FEEDBACKS', id, recordData) : ApiClient.call('apiCreateRecord', 'FEEDBACKS', recordData);

      promise
        .then(function () {
          UI.setLoading(btn, false);
          UI.closeModal('modal-feedback-form');
          UI.showToast('Sucesso', 'Feedback salvo com sucesso!', 'success');
          loadFeedbacksList();
          loadDashboardData();

        .catch(function (err) {
          UI.setLoading(btn, false);
          UI.showToast('Erro ao Salvar', err.message, 'error');

    function filterLivrosList() {
      var searchInput = document.getElementById('livros-search-input');
      var estanteSelect = document.getElementById('livros-filter-estante');

      var query = searchInput ? searchInput.value.trim().toLowerCase() : '';
      var estanteFilter = estanteSelect ? estanteSelect.value : 'todos';

      var filtered = state.livrosList.filter(function (item) {
        var matchEstante = true;
        if (estanteFilter === 'favoritos') {
          matchEstante = Boolean(item.favorito);
        } else if (estanteFilter !== 'todos') {
          matchEstante = (item.status === estanteFilter || item.estante === estanteFilter);
        }

        var textMatch = !query ||
          (item.titulo && item.titulo.toLowerCase().indexOf(query) !== -1) ||
          (item.autor && item.autor.toLowerCase().indexOf(query) !== -1) ||
          (item.categoria && item.categoria.toLowerCase().indexOf(query) !== -1);

        return matchEstante && textMatch;
      });

      renderBookshelf3D(filtered);
      renderLivrosCards(filtered);
    }

                  '<div class="book-3d-cover-title">' + UI.escapeHtml(livro.titulo) + '</div>' +

                '</div>' +

    var bookHoverHideTimer = null;

    function getBookSynopsisFallback(livro) {
      if (livro.resumo && String(livro.resumo).trim() !== '') {
        return String(livro.resumo).trim();
      }
      var t = String(livro.titulo || '').toLowerCase();
      if (t.indexOf('quem pensa enriquece') !== -1) {
        return 'Clássico de Napoleon Hill baseado no estudo de líderes e empreendedores de sucesso, apresentando princípios fundamentais de propósito definido, planejamento organizado, persistência, autogerenciamento e mentalidade orientada a realizações.';
      }
      if (t.indexOf('influência mental') !== -1 || t.indexOf('influencia mental') !== -1) {
        return 'Obra de William Walker Atkinson sobre concentração, domínio mental, magnetismo pessoal e comunicação persuasiva, explorando como desenvolver presença executiva e capacidade de influência positiva no ambiente profissional.';
      }
      if (t.indexOf('primeiros 90 dias') !== -1) {
        return 'Apresenta uma metodologia para profissionais que assumem novas responsabilidades ou posições, abordando como acelerar a adaptação, compreender o ambiente organizacional, estabelecer prioridades e conquistar credibilidade.';
      }
      if (t.indexOf('alta performance') !== -1 || t.indexOf('measure what matters') !== -1) {
        return 'Apresenta a metodologia OKR (Objectives and Key Results), utilizada por organizações para estabelecer objetivos claros, resultados-chave mensuráveis e alinhamento entre equipes.';
      }
      if (t.indexOf('storytelling com dados') !== -1) {
        return 'Apresenta técnicas para transformar dados em narrativas visuais claras e persuasivas. Ensina como construir gráficos, organizar informações e transmitir mensagens relevantes por meio de apresentações e dashboards.';
      }
      if (t.indexOf('a meta') !== -1 || t.indexOf('the goal') !== -1) {
        return 'Apresenta a Teoria das Restrições por meio de uma narrativa empresarial. Demonstra como identificar gargalos, compreender limitações dos processos e melhorar o desempenho global de uma organização.';
      }
      return 'Sinopse ainda não cadastrada para esta obra. Clique em "Editar Livro" para adicionar o resumo.';
    }

    function showBookHoverCard(evt, livroId) {
      cancelHideBookHoverCard();
      var popover = document.getElementById('book-hover-popover');
      if (!popover) return;

      var livro = state.livrosList.find(function (l) { return l.id === livroId; });
      if (!livro) return;

      var totalPag = Number(livro.total_paginas) || 1;
      var pagAtual = Number(livro.pagina_atual) || 0;
      var pct = Math.min(100, Math.round((pagAtual / totalPag) * 100));
      var cor = livro.capa_cor || '#8b5cf6';

      var statusBadgeClass = 'badge-info';
      var statusLabel = 'Quero Ler 🎯';
      if (livro.status === 'lendo') {
        statusBadgeClass = 'badge-violet';
        statusLabel = 'Lendo Agora 📖';
      } else if (livro.status === 'concluido') {
        statusBadgeClass = 'badge-success';
        statusLabel = 'Concluído 🏆';
      } else if (livro.status === 'pausado') {
        statusBadgeClass = 'badge-warning';
        statusLabel = 'Pausado ⏸️';
      }

      var starsNum = Number(livro.avaliacao_pessoal) || 0;
      var starsHtml = '';
      if (starsNum > 0) {
        starsHtml = '<span style="color:#f59e0b; font-size:0.78rem; letter-spacing:1px;">' + '★'.repeat(starsNum) + '☆'.repeat(Math.max(0, 5 - starsNum)) + '</span>';
      }

      var sinopse = getBookSynopsisFallback(livro);
      var aprendizados = livro.principais_aprendizados ? String(livro.principais_aprendizados).trim() : '';

      popover.innerHTML =
        '<div class="book-hover-header">' +
          '<div style="flex:1; min-width:0;">' +
            '<div class="book-hover-title">' + UI.escapeHtml(livro.titulo) + (livro.favorito ? ' <span title="Favorito">⭐</span>' : '') + '</div>' +
            '<div class="book-hover-author">' + UI.escapeHtml(livro.autor) + '</div>' +
          '</div>' +
          '<div style="display:flex; flex-direction:column; align-items:flex-end; gap:0.25rem; flex-shrink:0;">' +
            '<span class="badge ' + statusBadgeClass + '">' + statusLabel + '</span>' +
            starsHtml +
          '</div>' +
        '</div>' +
        (livro.categoria ? '<div style="margin-bottom:0.4rem;"><span class="tag-pill" style="margin:0; font-size:0.7rem;">📚 ' + UI.escapeHtml(livro.categoria) + '</span></div>' : '') +
        '<div class="book-hover-progress-box">' +
          '<div class="book-hover-progress-top">' +
            '<span class="book-hover-pct-value">' + pct + '% concluído</span>' +
            '<span class="book-hover-pages-text">Pág. ' + pagAtual + ' de ' + totalPag + '</span>' +
          '</div>' +
          '<div class="progress-bar-bg" style="height:7px;">' +
            '<div class="progress-bar-fill" style="width:' + pct + '%; background: linear-gradient(90deg, ' + cor + ', var(--accent-violet));"></div>' +
          '</div>' +
        '</div>' +
        '<div class="book-hover-section-label">📖 Sinopse do Livro</div>' +
        '<div class="book-hover-synopsis">' + UI.escapeHtml(sinopse) + '</div>' +
        (aprendizados
          ? '<div class="book-hover-section-label">💡 Principais Aprendizados</div>' +
            '<div class="book-hover-learnings">' + UI.escapeHtml(aprendizados) + '</div>'
          : '') +
        '<div class="book-hover-footer">' +
          '<button type="button" class="btn btn-primary btn-sm" style="padding:0.32rem 0.7rem; font-size:0.75rem;" onclick="App.hideBookHoverCardImmediately(); App.openSessaoLeituraModal(\'' + livro.id + '\')">+ Registrar Leitura</button>' +
          '<button type="button" class="btn btn-secondary btn-sm" style="padding:0.32rem 0.7rem; font-size:0.75rem;" onclick="App.hideBookHoverCardImmediately(); App.openEditLivroModal(\'' + livro.id + '\')">Editar Livro</button>' +
        '</div>';

      var targetEl = evt && evt.currentTarget ? evt.currentTarget : null;
      if (targetEl && targetEl.getBoundingClientRect) {
        var rect = targetEl.getBoundingClientRect();
        var popWidth = 350;
        var margin = 14;
        var leftPos = rect.right + margin;

        if (leftPos + popWidth > window.innerWidth - 12) {
          leftPos = rect.left - popWidth - margin;
        }
        if (leftPos < 12) {
          leftPos = Math.max(12, Math.round((window.innerWidth - popWidth) / 2));
        }

        popover.style.left = leftPos + 'px';
        popover.style.top = Math.max(16, rect.top - 10) + 'px';
        popover.classList.add('visible');

        // Ajuste fino vertical após renderizar altura real
        var popHeight = popover.offsetHeight || 280;
        var finalTop = rect.top - 10;
        if (finalTop + popHeight > window.innerHeight - 16) {
          finalTop = Math.max(16, window.innerHeight - popHeight - 16);
        }
        popover.style.top = finalTop + 'px';
      } else {
        popover.classList.add('visible');
      }
    }

    function scheduleHideBookHoverCard() {
      cancelHideBookHoverCard();
      bookHoverHideTimer = setTimeout(function () {
        hideBookHoverCardImmediately();
      }, 160);
    }

    function cancelHideBookHoverCard() {
      if (bookHoverHideTimer) {
        clearTimeout(bookHoverHideTimer);
        bookHoverHideTimer = null;
      }
    }

    function hideBookHoverCardImmediately() {
      cancelHideBookHoverCard();
      var popover = document.getElementById('book-hover-popover');
      if (popover) {
        popover.classList.remove('visible');

    }

    function handleCoverFileUpload(fileInput) {
      var file = fileInput.files && fileInput.files[0];
      if (!file) return;

      if (!file.type.match('image.*')) {
        UI.showToast('Arquivo Inválido', 'Por favor, selecione uma imagem válida (JPG, PNG, WebP).', 'warning');
        return;
      }

      var reader = new FileReader();
      reader.onload = function (e) {
        var img = new Image();
        img.onload = function () {
          var maxW = 240;
          var maxH = 360;
          var w = img.width;
          var h = img.height;

          if (w > maxW || h > maxH) {
            if (w / maxW > h / maxH) {
              h = Math.round((h * maxW) / w);
              w = maxW;
            } else {
              w = Math.round((w * maxH) / h);
              h = maxH;
            }
          }

          var canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);

          var quality = 0.80;
          var dataUrl = canvas.toDataURL('image/jpeg', quality);
          while (dataUrl.length > 38000 && quality > 0.35) {
            quality -= 0.10;
            dataUrl = canvas.toDataURL('image/jpeg', quality);
          }

          pendingCoverDataUrl = dataUrl;
          var urlInput = document.getElementById('livro-field-capa-url');
          if (urlInput) {
            urlInput.value = '[Imagem carregada: ' + file.name + ']';
          }
          updateModalLivroPreview();
          UI.showToast('Imagem Carregada', 'Capa otimizada! Clique em "Salvar Livro" para gravar na planilha.', 'success', 3000);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function saveSessaoLeitura() {
      var btn = document.getElementById('btn-save-sessao');
      var livroId = document.getElementById('sessao-field-livro-id').value;
      var pagFinal = Number(document.getElementById('sessao-field-pagina-final').value);
      var duracao = Number(document.getElementById('sessao-field-duracao').value) || 0;
      var notas = document.getElementById('sessao-field-notas').value.trim();

      if (!pagFinal || pagFinal <= 0) {
        UI.showToast('Campo Obrigatório', 'Informe a página final alcançada.', 'warning');
        return;
      }

      var item = state.livrosList.find(function (l) { return l.id === livroId; });
      var pagAnterior = item ? (Number(item.pagina_atual) || 0) : 0;
      var lidas = Math.max(0, pagFinal - pagAnterior);

      var sessaoData = {
        livro_id: livroId,
        pagina_final: pagFinal,
        paginas_lidas: lidas,
        duracao_minutos: duracao,
        notas_sessao: notas
      };

      UI.setLoading(btn, true, 'Registrando...');
      ApiClient.call('apiUpdateLivroLeitura', sessaoData)
        .then(function () {
          UI.setLoading(btn, false);
          UI.closeModal('modal-leitura-sessao');

    function checkDatabaseConnection(btnElement) {
      var statusBadge = document.getElementById('db-status-badge');
      var statusDot = document.getElementById('db-status-dot');
      var statusText = document.getElementById('db-status-text');
      var dbMetricsGrid = document.getElementById('db-metrics-grid');
      var unconfiguredBanner = document.getElementById('unconfigured-banner');

      if (btnElement) UI.setLoading(btnElement, true, 'Carregando...');

      ApiClient.call('apiGetDatabaseStatus')
        .then(function (status) {
          if (btnElement) UI.setLoading(btnElement, false);

          if (status.configured && status.status === 'CONECTADO') {
            if (statusDot) statusDot.className = 'status-dot active';
            if (statusBadge) statusBadge.className = 'badge badge-success';
            if (statusText) statusText.textContent = 'Conectado';

            if (unconfiguredBanner) unconfiguredBanner.style.display = 'none';
            if (dbMetricsGrid) dbMetricsGrid.style.display = 'grid';

            var totalSheetsEl = document.getElementById('metric-total-sheets');
            if (totalSheetsEl) totalSheetsEl.textContent = status.totalSheets || '15';

            var emailEl = document.getElementById('metric-user-email');
            if (emailEl) emailEl.textContent = status.currentUser || '—';

            var nameEl = document.getElementById('metric-sheet-name');
            if (nameEl) nameEl.textContent = status.spreadsheetName || 'Elevare PDI';

            var linkEl = document.getElementById('metric-sheet-link');
            if (linkEl && status.spreadsheetUrl) {
              linkEl.href = status.spreadsheetUrl;
              linkEl.style.display = 'inline-flex';
            }

            renderSheetsTable(status.sheets);
          } else {
            if (statusDot) statusDot.className = 'status-dot pending';
            if (statusBadge) statusBadge.className = 'badge badge-warning';
            if (statusText) statusText.textContent = 'Não Inicializado';

            if (unconfiguredBanner) unconfiguredBanner.style.display = 'block';
            if (dbMetricsGrid) dbMetricsGrid.style.display = 'none';
          }
        })
        .catch(function () {
          if (btnElement) UI.setLoading(btnElement, false);
          if (statusDot) statusDot.className = 'status-dot error';
          if (statusBadge) statusBadge.className = 'badge badge-error';
          if (statusText) statusText.textContent = 'Erro';
        });
    }

    function renderSheetsTable(sheets) {
      var tbody = document.getElementById('sheets-table-body');
      if (!tbody) return;

      if (!sheets || sheets.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:var(--text-muted); padding:2rem;">Nenhuma aba encontrada.</td></tr>';
        return;
      }

      var html = '';
      for (var i = 0; i < sheets.length; i++) {
        var s = sheets[i];
        html += 
          '<tr style="border-bottom: 1px solid var(--border-subtle);">' +
            '<td style="padding: 0.75rem 1rem;"><strong>' + UI.escapeHtml(s.name) + '</strong></td>' +
            '<td style="padding: 0.75rem 1rem;"><span class="badge badge-info">' + s.rows + ' registros</span></td>' +
            '<td style="padding: 0.75rem 1rem; color:var(--text-secondary);">' + s.cols + ' colunas</td>' +
            '<td style="padding: 0.75rem 1rem;"><span class="badge badge-success">OK</span></td>' +
          '</tr>';
      }
      tbody.innerHTML = html;
    }

      if (!confirm('Deseja inicializar o banco de dados agora? As abas estruturadas serão criadas na sua planilha do Google Drive.')) {

      UI.setLoading(btnElement, true, 'Configurando...');

          UI.setLoading(btnElement, false);
          UI.showToast('Instalação Concluída', 'Banco configurado com ' + result.totalSheets + ' abas no seu Google Drive.', 'success', 6000);
          checkDatabaseConnection();
        })
        .catch(function (err) {
          UI.setLoading(btnElement, false);
          UI.showToast('Falha na Configuração', err.message, 'error', 8000);
        });
    }

    function runPersistenceTest(btnElement) {
      var consoleBox = document.getElementById('test-console-output');
      var noteInput = document.getElementById('test-note-input');
      var testNote = noteInput ? noteInput.value : '';

      UI.setLoading(btnElement, true, 'Executando 7 Testes...');
      if (consoleBox) {
        consoleBox.textContent = '⏳ Executando bateria completa de 7 testes de persistência real no Google Sheets...\n- Comunicando via google.script.run...\n- Aguardando execução do LockService e SpreadsheetApp...\n';
      }

      ApiClient.call('apiRunFullPersistenceValidation', testNote)
        .then(function (res) {
          UI.setLoading(btnElement, false);
          UI.showToast('Persistência 100% Aprovada!', 'Todos os 7 testes foram validados no Google Sheets.', 'success', 6000);

          if (consoleBox) {
            var log = '=====================================================\n';
            log += '✅ BATERIA DE TESTES DE PERSISTÊNCIA: 100% APROVADA\n';
            log += '=====================================================\n';
            log += 'Horário: ' + res.timestamp + '\n';
            log += 'Planilha: ' + (res.spreadsheetUrl || 'Vinculada com sucesso') + '\n\n';

            if (res.tests && Array.isArray(res.tests)) {
              for (var i = 0; i < res.tests.length; i++) {
                var t = res.tests[i];
                log += '[' + t.step + '/7] ✅ ' + t.name.toUpperCase() + '\n';
                log += '      Detalhe: ' + t.detail + '\n\n';
              }
            }

            log += '=====================================================\n';
            log += 'RESULTADO: O Google Sheets está apto para suportar o PDI!\n';
            log += 'Nenhum dado real foi corrompido ou modificado.\n';
            log += '=====================================================';

            consoleBox.textContent = log;
          }

          checkDatabaseConnection();
        })
        .catch(function (err) {
          UI.setLoading(btnElement, false);
          UI.showToast('Falha no Teste', err.message, 'error', 8000);

          if (consoleBox) {
            consoleBox.textContent = 
              '=====================================================\n' +
              '❌ FALHA NA PERSISTÊNCIA REAL:\n' +
              '=====================================================\n' +
              err.message + '\n\n' +
              'Sugestão: Verifique se a função setupApplication() foi executada e se você concedeu as permissões ao Apps Script.';
          }
        });
    }

    // Inicialização ao carregar o DOM
    document.addEventListener('DOMContentLoaded', init);

    return {
      init: init,
      switchPane: switchPane,
      syncFullPdi: syncFullPdi,
      // PDI
      loadPdiList: loadPdiList,
      filterPdiList: filterPdiList,
      openCreatePdiModal: openCreatePdiModal,
      openEditPdiModal: openEditPdiModal,
      savePdiRecord: savePdiRecord,
      // Método SWOT
      loadSwotList: loadSwotList,
      filterSwotList: filterSwotList,
      openCreateSwotModal: openCreateSwotModal,
      openEditSwotModal: openEditSwotModal,
      saveSwotRecord: saveSwotRecord,
      openConvertSwotModal: openConvertSwotModal,
      confirmConvertSwot: confirmConvertSwot,
      // Skills
      loadSkillsList: loadSkillsList,
      filterSkillsList: filterSkillsList,
      openCreateSkillModal: openCreateSkillModal,
      openEditSkillModal: openEditSkillModal,
      saveSkillRecord: saveSkillRecord,
      openEvaluateSkillModal: openEvaluateSkillModal,
      selectEvalLevel: selectEvalLevel,
      saveEvaluationRecord: saveEvaluationRecord,
      // Metas
      loadMetasList: loadMetasList,
      filterMetasList: filterMetasList,
      openCreateMetaModal: openCreateMetaModal,
      openEditMetaModal: openEditMetaModal,
      saveMetaRecord: saveMetaRecord,
      openAddAcaoModal: openAddAcaoModal,
      saveAcaoRecord: saveAcaoRecord,
      toggleAcaoStatus: toggleAcaoStatus,
      // Feedbacks
      loadFeedbacksList: loadFeedbacksList,
      filterFeedbacksList: filterFeedbacksList,
      openCreateFeedbackModal: openCreateFeedbackModal,
      openEditFeedbackModal: openEditFeedbackModal,
      saveFeedbackRecord: saveFeedbackRecord,
      openConvertFeedbackModal: openConvertFeedbackModal,
      confirmConvertFeedback: confirmConvertFeedback,
      // Livros / Biblioteca 3D
      loadLivrosList: loadLivrosList,
      setBookshelfView: setBookshelfView,
      filterLivrosList: filterLivrosList,
      openCreateLivroModal: openCreateLivroModal,
      openEditLivroModal: openEditLivroModal,
      saveLivroRecord: saveLivroRecord,
      openSessaoLeituraModal: openSessaoLeituraModal,
      saveSessaoLeitura: saveSessaoLeitura,
      updateModalLivroPreview: updateModalLivroPreview,
      handleCoverFileUpload: handleCoverFileUpload,
      clearCoverImage: clearCoverImage,
      showBookHoverCard: showBookHoverCard,
      scheduleHideBookHoverCard: scheduleHideBookHoverCard,
      cancelHideBookHoverCard: cancelHideBookHoverCard,
      hideBookHoverCardImmediately: hideBookHoverCardImmediately,
      // Exclusão Segura
      requestDeleteRecord: requestDeleteRecord,
      executeDeleteRecord: executeDeleteRecord
    };
  })();
</script>
