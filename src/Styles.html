<style>
  /* ==========================================================================
     ELEVARE PDI — DESIGN SYSTEM & TOKENS VISUAIS (FASE 2)
     Suporte Completo a Tema Escuro (Grafite) e Tema Claro
     ========================================================================== */

  :root {
    /* Cores de Marca & Acentos Universais */
    --accent-violet: #8b5cf6;
    --accent-violet-dark: #7c3aed;
    --accent-violet-glow: rgba(139, 92, 246, 0.25);
    --accent-cyan: #06b6d4;
    --accent-cyan-glow: rgba(6, 182, 212, 0.25);
    --accent-blue: #3b82f6;
    --accent-blue-glow: rgba(59, 130, 246, 0.25);
    --gradient-brand: linear-gradient(135deg, #8b5cf6 0%, #3b82f6 50%, #06b6d4 100%);
    --gradient-card: linear-gradient(180deg, rgba(255, 255, 255, 0.03) 0%, transparent 100%);

    /* Estados de Feedback */
    --status-success: #10b981;
    --status-success-bg: rgba(16, 185, 129, 0.12);
    --status-warning: #f59e0b;
    --status-warning-bg: rgba(245, 158, 11, 0.12);
    --status-error: #ef4444;
    --status-error-bg: rgba(239, 68, 68, 0.12);
    --status-info: #06b6d4;
    --status-info-bg: rgba(6, 182, 212, 0.12);

    /* Dimensões do Layout */
    --sidebar-width: 260px;
    --sidebar-width-collapsed: 72px;
    --header-height: 68px;

    /* Transições e Curvas */
    --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
    --transition-fast: 0.15s ease;
    --transition-normal: 0.25s ease;
    --transition-smooth: 0.35s var(--ease-out-expo);

    /* Raios de Borda */
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 16px;
    --radius-xl: 22px;
    --radius-full: 9999px;
  }

  /* --------------------------------------------------------------------------
     TEMA ESCURO (PADRÃO — GRAFITE SOFISTICADO)
     -------------------------------------------------------------------------- */
  body[data-theme="dark"] {
    --bg-app: #0b0d13;
    --bg-sidebar: #10131c;
    --bg-header: rgba(16, 19, 28, 0.85);
    --bg-surface: #151924;
    --bg-surface-elevated: #1c2130;
    --bg-surface-hover: #23293c;
    --bg-input: #121520;
    --bg-modal-backdrop: rgba(5, 7, 12, 0.75);

    --border-subtle: rgba(255, 255, 255, 0.07);
    --border-medium: rgba(255, 255, 255, 0.14);
    --border-accent: rgba(139, 92, 246, 0.45);

    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --text-muted: #64748b;
    --text-inverse: #090d16;

    --shadow-sm: 0 2px 6px rgba(0, 0, 0, 0.3);
    --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.45);
    --shadow-lg: 0 16px 40px rgba(0, 0, 0, 0.6);
    --shadow-glow: 0 0 24px rgba(139, 92, 246, 0.25);
    --bg-glow-radial: radial-gradient(circle at 50% 0%, rgba(139, 92, 246, 0.12) 0%, transparent 60%);
  }

  /* --------------------------------------------------------------------------
     TEMA CLARO (ELEGANTE E LIMPO)
     -------------------------------------------------------------------------- */
  body[data-theme="light"] {
    --bg-app: #f4f6fa;
    --bg-sidebar: #ffffff;
    --bg-header: rgba(255, 255, 255, 0.9);
    --bg-surface: #ffffff;
    --bg-surface-elevated: #f8fafc;
    --bg-surface-hover: #edf2f7;
    --bg-input: #ffffff;
    --bg-modal-backdrop: rgba(15, 23, 42, 0.5);

    --border-subtle: #e2e8f0;
    --border-medium: #cbd5e1;
    --border-accent: rgba(139, 92, 246, 0.5);

    --text-primary: #0f172a;
    --text-secondary: #475569;
    --text-muted: #94a3b8;
    --text-inverse: #ffffff;

    --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.06);
    --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
    --shadow-lg: 0 12px 30px rgba(0, 0, 0, 0.12);
    --shadow-glow: 0 0 20px rgba(139, 92, 246, 0.15);
    --bg-glow-radial: radial-gradient(circle at 50% 0%, rgba(139, 92, 246, 0.06) 0%, transparent 50%);
  }

  /* Reset e Tipografia */
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background-color: var(--bg-app);
    color: var(--text-primary);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow-x: hidden;
    transition: background-color var(--transition-normal), color var(--transition-normal);
  }

  /* Layout Geral */
  .app-layout {
    display: flex;
    min-height: 100vh;
    background-image: var(--bg-glow-radial);
    background-attachment: fixed;
  }

  /* --------------------------------------------------------------------------
     BARRA LATERAL (SIDEBAR)
     -------------------------------------------------------------------------- */
  .sidebar {
    width: var(--sidebar-width);
    background: var(--bg-sidebar);
    border-right: 1px solid var(--border-subtle);
    display: flex;
    flex-direction: column;
    transition: width var(--transition-smooth);
    z-index: 50;
    flex-shrink: 0;
    position: sticky;
    top: 0;
    height: 100vh;
  }

  .sidebar.collapsed {
    width: var(--sidebar-width-collapsed);
  }

  .sidebar-header {
    height: var(--header-height);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 1.25rem;
    border-bottom: 1px solid var(--border-subtle);
  }

  .sidebar-logo {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    text-decoration: none;
    font-weight: 700;
    font-size: 1.15rem;
    letter-spacing: -0.02em;
    overflow: hidden;
    white-space: nowrap;
  }

  .sidebar-logo-text {
    background: var(--gradient-brand);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    transition: opacity var(--transition-fast);
  }

  .sidebar.collapsed .sidebar-logo-text {
    display: none;
  }

  .sidebar-toggle-btn {
    background: transparent;
    border: none;
    color: var(--text-secondary);
    cursor: pointer;
    padding: 0.45rem;
    border-radius: var(--radius-sm);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all var(--transition-fast);
  }

  .sidebar-toggle-btn:hover {
    color: var(--text-primary);
    background: var(--bg-surface-elevated);
  }

  .sidebar-nav {
    flex: 1;
    padding: 1rem 0.65rem;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
  }

  .nav-group-label {
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    padding: 0.75rem 0.85rem 0.35rem 0.85rem;
    white-space: nowrap;
    overflow: hidden;
  }

  .sidebar.collapsed .nav-group-label {
    display: none;
  }

  .nav-link {
    display: flex;
    align-items: center;
    gap: 0.85rem;
    padding: 0.65rem 0.85rem;
    color: var(--text-secondary);
    text-decoration: none;
    border-radius: var(--radius-md);
    font-size: 0.9rem;
    font-weight: 500;
    cursor: pointer;
    transition: all var(--transition-fast);
    border: 1px solid transparent;
    white-space: nowrap;
    position: relative;
  }

  .nav-link:hover {
    color: var(--text-primary);
    background: var(--bg-surface-hover);
  }

  .nav-link.active {
    color: #ffffff;
    background: var(--accent-violet);
    box-shadow: 0 2px 10px var(--accent-violet-glow);
  }

  body[data-theme="light"] .nav-link.active {
    color: #ffffff;
    background: var(--accent-violet-dark);
  }

  .nav-link-icon {
    width: 20px;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .sidebar.collapsed .nav-link-text {
    display: none;
  }

  .sidebar.collapsed .nav-link {
    justify-content: center;
    padding: 0.65rem 0;
  }

  .sidebar-footer {
    padding: 1rem 1.25rem;
    border-top: 1px solid var(--border-subtle);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 0.78rem;
    color: var(--text-muted);
  }

  .sidebar.collapsed .sidebar-footer {
    display: none;
  }

  /* --------------------------------------------------------------------------
     ÁREA PRINCIPAL & CABEÇALHO
     -------------------------------------------------------------------------- */
  .main-wrapper {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 100vh;
  }

  .topbar {
    height: var(--header-height);
    background: var(--bg-header);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border-subtle);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 2rem;
    position: sticky;
    top: 0;
    z-index: 40;
  }

  .search-wrapper {
    position: relative;
    max-width: 360px;
    width: 100%;
  }

  .search-input {
    width: 100%;
    background: var(--bg-input);
    border: 1px solid var(--border-medium);
    border-radius: var(--radius-full);
    padding: 0.55rem 1rem 0.55rem 2.4rem;
    font-size: 0.88rem;
    color: var(--text-primary);
    outline: none;
    transition: all var(--transition-fast);
  }

  .search-input:focus {
    border-color: var(--accent-violet);
    box-shadow: 0 0 0 3px var(--accent-violet-glow);
  }

  .search-icon {
    position: absolute;
    left: 0.85rem;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    pointer-events: none;
  }

  .topbar-actions {
    display: flex;
    align-items: center;
    gap: 0.85rem;
  }

  /* Botão Alternador de Tema */
  .theme-toggle-btn {
    width: 38px;
    height: 38px;
    border-radius: var(--radius-full);
    border: 1px solid var(--border-medium);
    background: var(--bg-surface);
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all var(--transition-fast);
  }

  .theme-toggle-btn:hover {
    color: var(--text-primary);
    border-color: var(--accent-violet);
    transform: rotate(15deg);
  }

  /* --------------------------------------------------------------------------
     CONTEÚDO DA PÁGINA (PAGES & TABS)
     -------------------------------------------------------------------------- */
  .page-content {
    flex: 1;
    padding: 2rem;
    max-width: 1440px;
    width: 100%;
    margin: 0 auto;
  }

  /* Abas de Navegação Superior */
  .view-tabs {
    display: flex;
    gap: 0.5rem;
    border-bottom: 1px solid var(--border-subtle);
    margin-bottom: 2rem;
  }

  .view-tab {
    padding: 0.75rem 1.25rem;
    font-size: 0.92rem;
    font-weight: 600;
    color: var(--text-secondary);
    border: none;
    background: transparent;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all var(--transition-fast);
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .view-tab:hover {
    color: var(--text-primary);
  }

  .view-tab.active {
    color: var(--accent-violet);
    border-bottom-color: var(--accent-violet);
  }

  /* Hero Banner do Dashboard */
  .hero-banner {
    background: var(--bg-surface);
    background-image: var(--gradient-card);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-xl);
    padding: 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1.5rem;
    margin-bottom: 2rem;
    box-shadow: var(--shadow-sm);
    position: relative;
    overflow: hidden;
  }

  .hero-banner::after {
    content: '';
    position: absolute;
    right: -60px;
    top: -60px;
    width: 220px;
    height: 220px;
    border-radius: 50%;
    background: var(--gradient-brand);
    opacity: 0.08;
    pointer-events: none;
  }

  .hero-greeting {
    font-size: 1.65rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--text-primary);
    margin-bottom: 0.35rem;
  }

  .hero-subtitle {
    font-size: 0.95rem;
    color: var(--text-secondary);
    max-width: 600px;
  }

  /* --------------------------------------------------------------------------
     GRID DE CARDS E KPIS
     -------------------------------------------------------------------------- */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 1.25rem;
    margin-bottom: 2rem;
  }

  .kpi-card {
    background: var(--bg-surface);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg);
    padding: 1.35rem;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-shadow: var(--shadow-sm);
    transition: transform var(--transition-fast), border-color var(--transition-fast), box-shadow var(--transition-fast);
  }

  .kpi-card:hover {
    transform: translateY(-2px);
    border-color: var(--border-medium);
    box-shadow: var(--shadow-md);
  }

  .kpi-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 0.75rem;
  }

  .kpi-label {
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .kpi-icon-badge {
    width: 36px;
    height: 36px;
    border-radius: var(--radius-md);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .kpi-value {
    font-size: 1.85rem;
    font-weight: 700;
    color: var(--text-primary);
    line-height: 1.2;
    margin-bottom: 0.35rem;
  }

  .kpi-subtext {
    font-size: 0.8rem;
    color: var(--text-secondary);
  }

  /* Layout 2 Colunas */
  .grid-two-col {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 1.5rem;
    margin-bottom: 2rem;
  }

  .content-card {
    background: var(--bg-surface);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg);
    padding: 1.5rem;
    box-shadow: var(--shadow-sm);
  }

  .content-card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1.25rem;
  }

  .card-title {
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--text-primary);
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }

  /* Estados Vazios Elegantes (Empty States) */
  .empty-state {
    text-align: center;
    padding: 2.5rem 1.5rem;
    color: var(--text-muted);
  }

  .empty-state-icon {
    width: 48px;
    height: 48px;
    margin: 0 auto 1rem auto;
    color: var(--text-muted);
    opacity: 0.5;
  }

  .empty-state-title {
    font-size: 1rem;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: 0.35rem;
  }

  .empty-state-desc {
    font-size: 0.85rem;
    color: var(--text-muted);
    max-width: 360px;
    margin: 0 auto 1.25rem auto;
  }

  /* Botões */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    padding: 0.6rem 1.2rem;
    font-size: 0.88rem;
    font-weight: 600;
    border-radius: var(--radius-md);
    border: 1px solid transparent;
    cursor: pointer;
    transition: all var(--transition-fast);
    text-decoration: none;
    white-space: nowrap;
  }

  .btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    pointer-events: none;
  }

  .btn-primary {
    background: var(--gradient-brand);
    color: #ffffff;
    box-shadow: 0 2px 10px var(--accent-violet-glow);
  }

  .btn-primary:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 4px 16px var(--accent-violet-glow);
  }

  .btn-secondary {
    background: var(--bg-surface-elevated);
    color: var(--text-primary);
    border-color: var(--border-medium);
  }

  .btn-secondary:hover:not(:disabled) {
    background: var(--bg-surface-hover);
  }

  .btn-outline {
    background: transparent;
    color: var(--accent-violet);
    border-color: var(--accent-violet);
  }

  .btn-outline:hover:not(:disabled) {
    background: var(--accent-violet-glow);
  }

  .btn-sm {
    padding: 0.38rem 0.75rem;
    font-size: 0.8rem;
    border-radius: var(--radius-sm);
  }

  /* Badges */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    padding: 0.22rem 0.6rem;
    font-size: 0.72rem;
    font-weight: 600;
    border-radius: var(--radius-full);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .badge-success { background: var(--status-success-bg); color: var(--status-success); border: 1px solid rgba(16, 185, 129, 0.25); }
  .badge-warning { background: var(--status-warning-bg); color: var(--status-warning); border: 1px solid rgba(245, 158, 11, 0.25); }
  .badge-error { background: var(--status-error-bg); color: var(--status-error); border: 1px solid rgba(239, 68, 68, 0.25); }
  .badge-info { background: var(--status-info-bg); color: var(--status-info); border: 1px solid rgba(6, 182, 212, 0.25); }
  .badge-violet { background: rgba(139, 92, 246, 0.12); color: var(--accent-violet); border: 1px solid rgba(139, 92, 246, 0.25); }

  /* Pontos de Status */
  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    display: inline-block;
  }
  .status-dot.active { background-color: var(--status-success); box-shadow: 0 0 8px var(--status-success); }
  .status-dot.pending { background-color: var(--status-warning); box-shadow: 0 0 8px var(--status-warning); }
  .status-dot.error { background-color: var(--status-error); box-shadow: 0 0 8px var(--status-error); }

  /* --------------------------------------------------------------------------
     SISTEMA DE MODAL
     -------------------------------------------------------------------------- */
  .modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: var(--bg-modal-backdrop);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    opacity: 0;
    visibility: hidden;
    transition: opacity var(--transition-normal), visibility var(--transition-normal);
  }

  .modal-overlay.open {
    opacity: 1;
    visibility: visible;
  }

  .modal-card {
    background: var(--bg-surface);
    border: 1px solid var(--border-medium);
    border-radius: var(--radius-xl);
    width: 90%;
    max-width: 540px;
    max-height: 85vh;
    overflow-y: auto;
    box-shadow: var(--shadow-lg);
    transform: scale(0.95);
    transition: transform var(--transition-smooth);
    display: flex;
    flex-direction: column;
  }

  .modal-overlay.open .modal-card {
    transform: scale(1);
  }

  .modal-header {
    padding: 1.25rem 1.5rem;
    border-bottom: 1px solid var(--border-subtle);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .modal-title {
    font-size: 1.15rem;
    font-weight: 700;
  }

  .modal-close {
    background: transparent;
    border: none;
    color: var(--text-muted);
    font-size: 1.5rem;
    cursor: pointer;
    line-height: 1;
  }

  .modal-body {
    padding: 1.5rem;
    flex: 1;
  }

  .modal-footer {
    padding: 1rem 1.5rem;
    border-top: 1px solid var(--border-subtle);
    display: flex;
    justify-content: flex-end;
    gap: 0.75rem;
  }

  /* Formulários */
  .form-group {
    margin-bottom: 1.15rem;
  }

  .form-label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: 0.4rem;
  }

  .form-control {
    width: 100%;
    background: var(--bg-surface-elevated);
    border: 1px solid var(--border-medium);
    border-radius: var(--radius-md);
    padding: 0.65rem 0.85rem;
    color: var(--text-primary);
    font-size: 0.9rem;
    outline: none;
    transition: border-color var(--transition-fast);
  }

  .form-control:focus {
    border-color: var(--accent-violet);
  }

  /* Toasts */
  .toast-container {
    position: fixed;
    bottom: 1.5rem;
    right: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    z-index: 2000;
    max-width: 400px;
    width: calc(100% - 3rem);
    pointer-events: none;
  }

  .toast {
    display: flex;
    align-items: flex-start;
    gap: 0.75rem;
    padding: 0.9rem 1.15rem;
    background: var(--bg-surface);
    border: 1px solid var(--border-medium);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-lg);
    color: var(--text-primary);
    pointer-events: auto;
    animation: toast-in 0.3s var(--ease-out-expo) forwards;
  }

  .toast.toast-success { border-left: 4px solid var(--status-success); }
  .toast.toast-error { border-left: 4px solid var(--status-error); }
  .toast.toast-warning { border-left: 4px solid var(--status-warning); }
  .toast.toast-info { border-left: 4px solid var(--status-info); }

  @keyframes toast-in {
    from { opacity: 0; transform: translateY(1rem) scale(0.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .spinner {
    width: 18px;
    height: 18px;
    border: 2px solid rgba(255, 255, 255, 0.25);
    border-top-color: #ffffff;
