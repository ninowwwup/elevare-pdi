<script>
  /**
   * Elevare PDI — Biblioteca de Componentes de Interface (UI)
   * Fornece gerenciamento de toasts, modais, spinners e helpers visuais.
   */
  window.UI = (function () {
    // Mapa de ícones SVG limpos e otimizados (sem dependência externa)
    var ICONS = {
      'check-circle': '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>',
      'alert-triangle': '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>',
      'info': '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>',
      'x-circle': '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>',
      'database': '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path></svg>',
      'refresh': '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.19"/></svg>'
    };

    /**
     * Exibe uma notificação toast no canto da tela.
     * @param {string} title Título
     * @param {string} message Mensagem descritiva
     * @param {'success'|'error'|'warning'|'info'} [type='info'] Tipo
     * @param {number} [duration=5000] Duração em ms
     */
    function showToast(title, message, type, duration) {
      type = type || 'info';
      duration = duration || 5000;

      var container = document.getElementById('toast-container');
      if (!container) {
        container = document.createElement('div');
        container.id = 'toast-container';
        container.className = 'toast-container';
        document.body.appendChild(container);
      }

      var toast = document.createElement('div');
      toast.className = 'toast toast-' + type;

      var iconSvg = ICONS['info'];
      if (type === 'success') iconSvg = ICONS['check-circle'];
      if (type === 'error') iconSvg = ICONS['x-circle'];
      if (type === 'warning') iconSvg = ICONS['alert-triangle'];

      toast.innerHTML = 
        '<div style="flex-shrink:0;">' + iconSvg + '</div>' +
        '<div class="toast-content">' +
          '<div class="toast-title">' + escapeHtml(title) + '</div>' +
          '<div>' + escapeHtml(message) + '</div>' +
        '</div>' +
        '<button class="toast-close" title="Fechar">&times;</button>';

      var closeBtn = toast.querySelector('.toast-close');
      var dismissed = false;

      function dismiss() {
        if (dismissed) return;
        dismissed = true;
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(1rem) scale(0.95)';
        setTimeout(function () {
          if (toast.parentNode) {
            toast.parentNode.removeChild(toast);
          }
        }, 250);
      }

      closeBtn.addEventListener('click', dismiss);
      setTimeout(dismiss, duration);

      container.appendChild(toast);
    }

    /**
     * Controla o estado de carregamento de um botão.
     * @param {HTMLElement} btn Elemento botão
     * @param {boolean} isLoading Se está carregando
     * @param {string} [loadingText] Texto temporário
     */
    function setLoading(btn, isLoading, loadingText) {
      if (!btn) return;
      if (isLoading) {
        btn.dataset.originalText = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span> ' + (loadingText || 'Carregando...');
      } else {
        btn.disabled = false;
        if (btn.dataset.originalText) {
          btn.innerHTML = btn.dataset.originalText;
        }
      }
    }

    /**
     * Escapa caracteres HTML para exibição segura.
     * @param {string} str
     * @return {string}
     */
    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    return {
      ICONS: ICONS,
      showToast: showToast,
      setLoading: setLoading,
      escapeHtml: escapeHtml
    };
  })();
</script>
